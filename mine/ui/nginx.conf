# Web server of the mine page. Mounted as an nginx template: the image's
# entrypoint replaces ${DITTO_BASIC_AUTH}, ${INFLUX_TOKEN}, ${GRAFANA_PORT}
# and ${MINE_NAMESPACES} from the environment at start-up and leaves nginx's
# own $variables alone.
#
# MINE_NAMESPACES names the namespace of the mine's twins; while the mine
# moves to a new namespace it names both, the new one first, separated by a
# space. Only twins of these namespaces can be messaged or have their history
# read through this server.
#
# The browser only ever talks to this server:
#   /config.json       the namespaces above, for the page
#   /ditto/api/2/...   read twins, search them, follow their changes and send
#                      the live messages of the page's buttons; it cannot
#                      create, change or delete a twin
#   /influx/query      history of one twin's numeric features (read-only)
#   /influx/journal    recent journal events of a namespace (read-only)
#   /grafana           redirect to the mine history dashboard in Grafana
# Credentials are added here and never reach the browser.

# History window the page may ask for, and the averaging step that goes with
# it. Anything else is refused, so the request cannot shape the query.
map $arg_range $history_range {
    default "";
    5m      "5m";
    15m     "15m";
    30m     "30m";
    1h      "1h";
    3h      "3h";
}
# Live messages the page sends, and nothing else: a twin and a subject the
# page has no button for are refused here, before they reach Ditto. Matched
# against the normalised path, so an escaped colon or slash changes nothing.
map $uri $message_allowed {
    default 0;
    "~^/ditto/api/2/things/[a-z0-9.]+:scenario-[a-z0-9-]+/inbox/messages/(activate|cancel)$"   1;
    "~^/ditto/api/2/things/[a-z0-9.]+:module-[a-z0-9-]+/inbox/messages/set-enabled$"          1;
    "~^/ditto/api/2/things/[a-z0-9.]+:mine/inbox/messages/(set-speed|pause|resume|forecast)$" 1;
    "~^/ditto/api/2/things/[a-z0-9.]+:module-advisor/inbox/messages/apply$"                   1;
}

# The namespace a request names, and whether it is one of MINE_NAMESPACES:
# the check looks for " <namespace> " in the list with spaces around it.
map $uri $message_namespace {
    default "";
    "~^/ditto/api/2/things/(?<ns>[a-z0-9.]+):" $ns;
}
map "$message_namespace| ${MINE_NAMESPACES} " $message_namespace_ok {
    default 0;
    "~^([a-z0-9.]+)\|.* \1 " 1;
}
map $arg_thing $history_namespace {
    default "";
    "~^(?<ns>[a-z0-9.]+):[a-z0-9-]+$" $ns;
}
map "$history_namespace| ${MINE_NAMESPACES} " $history_namespace_ok {
    default 0;
    "~^([a-z0-9.]+)\|.* \1 " 1;
}
map "$arg_ns| ${MINE_NAMESPACES} " $journal_namespace_ok {
    default 0;
    "~^([a-z0-9.]+)\|.* \1 " 1;
}

map $arg_range $history_every {
    default "30s";
    5m      "5s";
    15m     "15s";
    30m     "30s";
    1h      "1m";
    3h      "3m";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv application/csv;

    # Docker's DNS, asked again every few seconds so that a recreated
    # ditto-nginx or influxdb container is found without restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ditto http://ditto-nginx:80;
    set $influx http://influxdb:8086;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "Basic ${DITTO_BASIC_AUTH}";
    # Server-sent events must pass through unbuffered and may stay open for long.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The library of the 3D view does not change within a version: the
    # browser may keep it.
    location /vendor/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{"namespaces": "${MINE_NAMESPACES}"}\n';
    }

    # The dashboard «Бозшаколь — история» (mine/grafana): visitors see it without
    # an account, a logged-in user sees the copy in the platform's organisation.
    location = /grafana {
        return 302 $scheme://$host:${GRAFANA_PORT}/d/bozshakol-history;
    }

    # Reading: things by ID, the change stream and the search. Nothing else of
    # Ditto (policies, connections, devops) is reachable through this server.
    location /ditto/api/2/things {
        limit_except GET { deny all; }
        rewrite ^/ditto/(.*)$ /$1 break;
        proxy_pass $ditto;
    }
    location /ditto/api/2/search/things {
        limit_except GET { deny all; }
        rewrite ^/ditto/(.*)$ /$1 break;
        proxy_pass $ditto;
    }
    location /ditto/ {
        return 403;
    }

    # Writing: only the live messages listed in $message_allowed above.
    location ~ ^/ditto/api/2/things/[^/]+/inbox/messages/[^/]+$ {
        limit_except POST { deny all; }
        if ($message_allowed = 0) { return 403; }
        if ($message_namespace_ok = 0) { return 403; }
        rewrite ^/ditto/(.*)$ /$1 break;
        proxy_pass $ditto;
    }

    # History. The page names a twin and a window; the Flux text is written
    # here, so the only thing that ever reaches InfluxDB is one of the two
    # read queries below, sent to its query endpoint. A location that sets its
    # own request headers inherits none, so the Ditto credentials stay out.
    location = /influx/query {
        limit_except GET { deny all; }
        if ($history_namespace_ok = 0) { return 400; }
        if ($history_range = "") { return 400; }
        proxy_method POST;
        proxy_set_header Host influxdb;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Token ${INFLUX_TOKEN}";
        proxy_set_header Content-Type "application/vnd.flux";
        proxy_set_header Accept "application/csv";
        proxy_set_body 'import "types"
from(bucket: "default")
  |> range(start: -$history_range)
  |> filter(fn: (r) => r._measurement == "mqtt_consumer" and r.thingId == "$arg_thing" and r._field =~ /^value_.+_properties_value/)
  |> filter(fn: (r) => types.isType(v: r._value, type: "float"))
  |> aggregateWindow(every: $history_every, fn: mean, createEmpty: false)
  |> keep(columns: ["_time", "_value", "_field"])';
        proxy_buffering on;
        proxy_read_timeout 20s;
        proxy_pass $influx/api/v2/query?org=opentwins;
    }

    location = /influx/journal {
        limit_except GET { deny all; }
        if ($journal_namespace_ok = 0) { return 400; }
        proxy_method POST;
        proxy_set_header Host influxdb;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Token ${INFLUX_TOKEN}";
        proxy_set_header Content-Type "application/vnd.flux";
        proxy_set_header Accept "application/csv";
        proxy_set_body 'from(bucket: "default")
  |> range(start: -6h)
  |> filter(fn: (r) => r._measurement == "mqtt_consumer" and r.thingId == "$arg_ns:journal" and r._field =~ /^value_(severity|thing|text|sim_time)_properties_value/)
  |> keep(columns: ["_time", "_value", "_field"])
  |> group()
  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
  |> sort(columns: ["_time"])
  |> tail(n: 80)';
        proxy_buffering on;
        proxy_read_timeout 20s;
        proxy_pass $influx/api/v2/query?org=opentwins;
    }

    # Nothing else of InfluxDB is reachable through this server.
    location /influx/ {
        return 403;
    }
}
