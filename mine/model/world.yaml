  drill: "Sandvik D55SP"
  crusher: "FLSmidth (Fuller-Traylor) 60 × 113 дюймов, гирационная"
  sag_mill: "FLSmidth, 40 × 26 футов, 28 МВт, безредукторный привод"
  ball_mill: "FLSmidth, 28 × 44 фута, 22 МВт каждая, безредукторный привод"

