# A simplified model of the whole Bozshakol copper mine (KAZ Minerals, Pavlodar
# Region, 73 km west of Ekibastuz): the open pit, the sulphide concentrator
# ОФ-1 and the clay-ore plant ОФ-2. Geometry, topology, names and initial
# state; equipment and process numbers live in params.yaml, the pit geometry
# is built from this description by mine/model/layout.py.
#
# Coordinates are metres on the local mine grid: x grows east, y grows north,
# z is the elevation of the pit marks (the +40 m mark lies 190 m below the
# surface, so the surface is at about +230 m). build_twins.py turns this file
# into the Ditto things; the simulator and the modules read the things, never
# this file, so nothing here is typed twice.
#
# The layout is a model: KAZ Minerals publishes no pit survey, haul distances
# or plant positions (docs/mine/parameters.md, group «Карьер»). The pit's plan
# size (4,070 × 880 m at the top) and the stages of its deepening come from the
# 2023 application for the mining allocation (ecoportal 29174); where a public
# figure exists it is used and named in params.yaml.

# The namespace of every twin. The environment variable MINE_NAMESPACE, when
# set, takes precedence (mine/model/build_twins.py, load_world), so that the
# page and the services read one setting.
namespace: kz.bozshakol
policy: default:basic_policy

clock:
  shift_start: "2026-10-26T08:00:00"   # simulated time at which the model starts
  warm_start_min: 120                  # simulated minutes run silently before the first publish
  day_shift_from_h: 8
  day_shift_to_h: 20
  # Mass blasts in daylight only, at most one a day (params.yaml, blast.extra_window_below_h):
  # the second daylight window is used only when the broken stock runs short.
  blast_times: ["13:00"]
  extra_blast_times: ["16:30"]

mine:
  name: "Бозшаколь — модель рудника: карьер, сульфидная фабрика ОФ-1 и глинистая фабрика ОФ-2 (упрощённо)"
  surface_z: 230
  boundary: [[-2600, -2400], [3400, -2400], [3400, 4800], [-2600, 4800]]
  about:
    object: "Модель рудника Бозшаколь: карьер, сульфидная фабрика ОФ-1 и глинистая фабрика ОФ-2 (упрощённо). Медный рудник KAZ Minerals в Павлодарской области Казахстана, в 73 км к западу от Экибастуза"
    slice: "Упрощения: карьер — по размерам 2023 года (4070 × 880 м), с шестью рабочими уступами, остальные уступы — борта; фабрики — на производительности 2024 года (ОФ-1 3557 т/ч, ОФ-2 755 т/ч, вместе 34,7 млн т в год); горная масса — по проектному коэффициенту вскрыши 0,7 (вскрыша и забалансовая руда на тонну руды для фабрик; 59 млн т горной массы в год, план горных работ 2024 года — 60,4 млн т), на стенде это около 0,55 т вскрыши на тонну всей добытой руды с забалансовой; модуль управления фабрикой не поднимает питание ОФ-1 выше 3900 т/ч — наибольшей производительности на испытаниях 2024 года; глубина карьера, положение фабрик и дорог условны"
    data_basis: "Производительность, содержание и извлечение — отчёты KAZ Minerals о добыче за 2024 год (переработано 34,8 млн т руды, 0,40 % Cu, извлечение 78,1 %; добыто глинистой руды 6,1 млн т) и разрешения на эмиссии ОФ-1 и ОФ-2 (28 и 7 млн т в год); дробилка, мельницы, конвейер, коэффициент вскрыши 0,7 и модели техники — обзор проектов KAZ Minerals 2014 года; размеры карьера — заявление о намечаемой деятельности 2023 года; климат — нормы 1991–2020 станции Экибастуз. Извлечение ОФ-2, пороги глинистости и влияние глины на извлечение и пропускную способность ОФ-1 для Бозшаколя не опубликованы: это допущения модели. Источник каждого числа — docs/mine/parameters.md"
    disclaimer: "Модель построена по открытым данным; геометрия карьера, положение фабрик, расстановка забоев и состояние техники условны. Проект не связан с KAZ Minerals и не использует её внутренних данных"
    operator: "KAZ Minerals (Nova Resources B.V.)"

# The pit. The rim is a stadium (two half-circles joined by straight walls)
# of the size of the Bozshakol pit top in 2023; benches and their floors
# follow from params.yaml (`drill.bench_height_m`, `pit.face_angle_deg`,
# `pit.berm_m`). `working` lists the benches where a pushback is under way:
# their floor is widened by `sector.width_m` over an arc of the wall
# (`centre_deg` ± `core_deg`, fading out over `taper_deg`; angles count
# counter-clockwise from the east end, evenly along the rim: 90° is the middle
# of the north wall, 180° the west end, 270° the middle of the south wall),
# and the blast blocks sit on it. The lowest bench is the pit floor; its
# blocks form a straight grid.
pit:
  name: "Карьер Бозшаколь"
  centre: [0, 0]
  rim_z: 230
  floor_z: 5
  rim: {stadium: {length: 4070, width: 880}}
  working:
    - elevation_m: 215
      name: "Уступ 215 м (разноска восточного торца, вскрыша)"
      access_node: road-node-02
      grade_trend: -3.0
      sector: {centre_deg: 14, core_deg: 10, taper_deg: 6, width_m: 130}
      blocks: {start_deg: 4, direction: ccw, columns: 4, rows: 2, cell_m: [115, 50], gap_m: 5, strip_m: 30, face_offset_m: 15,
               initial: [{status: mining, remaining_pct: 55}, blasted, charged, drilled, insitu, insitu, insitu, insitu]}
    - elevation_m: 200
      name: "Уступ 200 м (западный торец, каолинизированная руда)"
      access_node: road-node-09
      grade_trend: 0.8
      sector: {centre_deg: 198, core_deg: 10, taper_deg: 6, width_m: 130}
      blocks: {start_deg: 189, direction: ccw, columns: 4, rows: 2, cell_m: [115, 50], gap_m: 5, strip_m: 30, face_offset_m: 15,
               initial: [blasted, {status: mining, remaining_pct: 85}, drilled, insitu, insitu, insitu, insitu, insitu]}
    - elevation_m: 155
      name: "Уступ 155 м (юго-западный борт, вскрыша)"
      access_node: road-node-08
      grade_trend: -3.0
      sector: {centre_deg: 224, core_deg: 10, taper_deg: 6, width_m: 130}
      blocks: {start_deg: 213, direction: ccw, columns: 4, rows: 2, cell_m: [115, 50], gap_m: 5, strip_m: 30, face_offset_m: 15,
               initial: [{status: mining, remaining_pct: 60}, blasted, insitu, insitu, insitu, insitu, insitu, insitu]}
    - elevation_m: 140
      name: "Уступ 140 м (северный борт)"
      access_node: road-node-03
      grade_trend: 0.6
      sector: {centre_deg: 52, core_deg: 10, taper_deg: 6, width_m: 130}
      blocks: {start_deg: 44, direction: ccw, columns: 4, rows: 2, cell_m: [115, 50], gap_m: 5, strip_m: 30, face_offset_m: 15,
               initial: [{status: mining, remaining_pct: 70}, blasted, drilled, insitu, insitu, insitu, insitu, insitu]}
    - elevation_m: 95
      name: "Уступ 95 м (северный борт)"
      access_node: road-node-04
      grade_trend: 0.4
      sector: {centre_deg: 80, core_deg: 10, taper_deg: 6, width_m: 130}
      blocks: {start_deg: 71, direction: ccw, columns: 4, rows: 2, cell_m: [115, 50], gap_m: 5, strip_m: 30, face_offset_m: 15,
               initial: [{status: mining, remaining_pct: 40}, blasted, charged, insitu, insitu, insitu, insitu, insitu]}
    - elevation_m: 5
      name: "Дно карьера, горизонт +5 м"
      access_node: road-node-06
      grade_trend: 1.5
      sector: {centre_deg: 0, core_deg: 0, taper_deg: 1, width_m: 0}
      blocks: {centre: [-340, 20], rotation_deg: 0, reverse_columns: false, columns: 4, rows: 3, cell_m: [115, 50], face_offset_m: 15,
               initial: [{status: mining, remaining_pct: 65}, blasted, blasted, charged, insitu, drilled, insitu, insitu, insitu, insitu, insitu, insitu]}

# Ramps down the walls. `exit_deg` is where the ramp leaves the pit at the
# rim, `legs_deg` the angles where it turns back (a switchback) and, last,
# beyond where it reaches the floor. On the long walls of the Bozshakol pit a
# ramp reaches the floor without a switchback.
ramps:
  - {id: east, name: "Главный (восточный) съезд вдоль северного борта", grade_pct: 8.0, exit_deg: 0, legs_deg: [135]}
  - {id: west, name: "Западный съезд вдоль южного борта", grade_pct: 10.0, exit_deg: 180, legs_deg: [300]}

geology:
  seed: 77
  pushback_shift_m: 480                # a new pushback samples the fields this far away

# Road graph. Every node lies on a loop, so closing any one segment leaves a
# way between any two nodes: the pit is one loop (main ramp — floor — west
# ramp — the surface roads round the pit), the surface roads form more (the
# crusher and stockyard loop, the services and dump loop, the north road to
# the plant site past ОФ-2). A node `on` a ramp sits where the ramp reaches
# elevation `z`; a `floor` node on the pit floor; the rest are surface points.
road_nodes:
  - {id: road-node-01, name: "Восточный выезд из карьера, +230 м",        ramp: east, z: 230}
  - {id: road-node-02, name: "Главный съезд, горизонт 215 м",             ramp: east, z: 215}
  - {id: road-node-03, name: "Главный съезд, горизонт 140 м",             ramp: east, z: 140}
  - {id: road-node-04, name: "Главный съезд, горизонт 95 м",              ramp: east, z: 95}
  - {id: road-node-05, name: "Главный съезд, дно карьера +5 м",           ramp: east, z: 5}
  - {id: road-node-06, name: "Дно карьера, рабочая площадка",             floor: [-340, 150]}
  - {id: road-node-07, name: "Западный съезд, дно карьера +5 м",          ramp: west, z: 5}
  - {id: road-node-08, name: "Западный съезд, горизонт 155 м",            ramp: west, z: 155}
  - {id: road-node-09, name: "Западный съезд, горизонт 200 м",            ramp: west, z: 200}
  - {id: road-node-10, name: "Западный выезд из карьера, +230 м",         ramp: west, z: 230}
  - {id: road-node-11, name: "Площадка первичной дробилки ОФ-1",          xyz: [2380, 230, 233]}
  - {id: road-node-12, name: "Рудный двор: склад богатой руды и склад забалансовой руды", xyz: [2620, -330, 232]}
  - {id: road-node-13, name: "Юго-восточная развилка",                    xyz: [2330, -720, 231]}
  - {id: road-node-14, name: "Ремонтная мастерская",                      xyz: [2760, -860, 232]}
  - {id: road-node-15, name: "Заправочная станция",                       xyz: [2560, -1110, 232]}
  - {id: road-node-16, name: "Въезд на отвал",                            xyz: [300, -1300, 234]}
  - {id: road-node-17, name: "Двор ОФ-2: приёмный склад фабрики и склад глинистой руды", xyz: [-760, 2620, 236]}
  - {id: road-node-18, name: "Северная развилка (дорога на промплощадку)", xyz: [1500, 1350, 233]}
  - {id: road-node-19, name: "Юго-западная развилка",                      xyz: [-1650, -900, 232]}

# `ramp` segments follow the ramp's centreline between their nodes; the rest
# run straight between their nodes through the bends in `via`. Length and
# grade are computed from the geometry; `class` selects the speed limit and
# the rolling resistance in params.yaml.
road_segments:
  - {id: road-segment-01, name: "Главный съезд: выезд — горизонт 215 м",     class: ramp, ramp: east, from: road-node-01, to: road-node-02}
  - {id: road-segment-02, name: "Главный съезд: горизонты 215 — 140 м",      class: ramp, ramp: east, from: road-node-02, to: road-node-03}
  - {id: road-segment-03, name: "Главный съезд: горизонты 140 — 95 м",       class: ramp, ramp: east, from: road-node-03, to: road-node-04}
  - {id: road-segment-04, name: "Главный съезд: горизонт 95 м — дно",        class: ramp, ramp: east, from: road-node-04, to: road-node-05}
  - {id: road-segment-05, name: "Дорога по дну карьера, северная часть",     class: bench, from: road-node-05, to: road-node-06}
  - {id: road-segment-06, name: "Дорога по дну карьера, южная часть",        class: bench, from: road-node-06, to: road-node-07}
  - {id: road-segment-07, name: "Западный съезд: дно — горизонт 155 м",      class: ramp, ramp: west, from: road-node-07, to: road-node-08}
  - {id: road-segment-08, name: "Западный съезд: горизонты 155 — 200 м",     class: ramp, ramp: west, from: road-node-08, to: road-node-09}
  - {id: road-segment-09, name: "Западный съезд: горизонт 200 м — выезд",    class: ramp, ramp: west, from: road-node-09, to: road-node-10}
  - {id: road-segment-10, name: "Дорога к дробилке ОФ-1",                    class: surface, from: road-node-01, to: road-node-11,
     via: [[2200, 120, 231]]}
  - {id: road-segment-11, name: "Дорога дробилка — рудный двор",             class: surface, from: road-node-11, to: road-node-12,
     via: [[2600, -60, 233]]}
  - {id: road-segment-12, name: "Дорога рудный двор — юго-восточная развилка", class: surface, from: road-node-12, to: road-node-13,
     via: [[2480, -560, 232]]}
  - {id: road-segment-13, name: "Дорога выезд — юго-восточная развилка",     class: surface, from: road-node-01, to: road-node-13,
     via: [[2180, -360, 231]]}
  - {id: road-segment-14, name: "Дорога к мастерской",                       class: surface, from: road-node-13, to: road-node-14}
  - {id: road-segment-15, name: "Дорога мастерская — заправка",              class: surface, from: road-node-14, to: road-node-15}
  - {id: road-segment-16, name: "Дорога заправка — отвал",                   class: surface, from: road-node-15, to: road-node-16,
     via: [[1400, -1260, 233]]}
  - {id: road-segment-17, name: "Дорога развилка — отвал",                   class: surface, from: road-node-13, to: road-node-16,
     via: [[1500, -1020, 232]]}
  - {id: road-segment-18, name: "Южная объездная дорога",                    class: surface, from: road-node-16, to: road-node-19,
     via: [[-700, -1180, 233]]}
  - {id: road-segment-19, name: "Западная объездная дорога",                 class: surface, from: road-node-19, to: road-node-10,
     via: [[-2250, -480, 231]]}
  - {id: road-segment-20, name: "Дорога западный выезд — двор ОФ-2",         class: surface, from: road-node-10, to: road-node-17,
     via: [[-2000, 900, 233], [-1300, 2000, 235]]}
  - {id: road-segment-21, name: "Северная дорога: двор ОФ-2 — северная развилка", class: surface, from: road-node-17, to: road-node-18,
     via: [[300, 2100, 235]]}
  - {id: road-segment-22, name: "Северная дорога: развилка — дробилка",      class: surface, from: road-node-18, to: road-node-11,
     via: [[2150, 800, 233]]}

