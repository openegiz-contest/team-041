workshop:
  name: "Ремонтная мастерская карьерной техники"
  xyz: [2790, -890, 232]
  access_node: road-node-14

weather:
  name: "Погода (метеостанция Экибастуз)"

modules:
  - {id: module-dispatch, name: "Модуль диспетчеризации"}
  - {id: module-grade,    name: "Модуль управления качеством руды"}
  - {id: module-plant,    name: "Модуль управления фабрикой"}
  - {id: module-maint,    name: "Модуль техобслуживания"}
  - {id: module-advisor,  name: "Модуль-советник"}

# Result slots of the forecast engine: slot 1 for the page, 2-5 for the
# advisor, and one slot for each control module's forecast «with the module / without it».
forecasts:
  slots: 10
  advisor_slots: [2, 3, 4, 5]
  module_slots: {module-dispatch: 6, module-grade: 7, module-plant: 8, module-maint: 9}
  # The end-to-end stand check (mine/tests/stand_check.sh) has a slot of its own, so that it never takes the page's.
  check_slots: [10]
  name: "Прогноз"
  page_title: "страница"
  advisor_title: "советник"
  check_title: "проверка стенда"

# `targets` names the kinds or twins a scenario may be aimed at.
scenarios:
  - {id: scenario-road-closure,     name: "Закрытие дороги",                  targets: road-segment, default_target: road-segment-01}
  - {id: scenario-shovel-failure,   name: "Отказ экскаватора",                targets: loader,       default_target: loader-01}
  - {id: scenario-crusher-stop,     name: "Остановка дробилки",               targets: crusher,      default_target: crusher}
  - {id: scenario-heavy-rain,       name: "Сильный дождь с мокрым снегом",    targets: weather,      default_target: weather}
  - {id: scenario-blast,            name: "Взрыв блока",                      targets: block,        default_target: block-01}
  - {id: scenario-clay-face,        name: "Глинистая руда в забое",           targets: loader,       default_target: loader-03}
  - {id: scenario-clay-plant-stop,  name: "Остановка глинистой фабрики",      targets: clay-plant,   default_target: clay-plant}
  - {id: scenario-sag-reline,       name: "Замена футеровки МПСИ",            targets: sag-mill,     default_target: mill-sag}

journal:
  name: "Журнал событий"
