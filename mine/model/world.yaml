# The haul trucks: how many work for each loader under the fixed plan (the
# fleet sizing in params.yaml, group `plan`, and mine/sim/design_basis.py), and
# the road nodes they start from. Their starting fuel and hours since service
# are spread evenly (mine/model/layout.py, `trucks`).
fleet:
  allocation: {loader-01: 8, loader-02: 6, loader-03: 4, loader-04: 3, loader-05: 4, loader-06: 6}
  service_spread_h: 240
  start_nodes:
    loader-01: [road-node-05, road-node-04, road-node-01, road-node-11, road-node-03]
    loader-02: [road-node-04, road-node-03, road-node-01, road-node-11]
    loader-03: [road-node-03, road-node-02, road-node-11, road-node-01]
    loader-04: [road-node-09, road-node-10, road-node-17, road-node-10]
    loader-05: [road-node-02, road-node-01, road-node-13, road-node-16]
    loader-06: [road-node-08, road-node-10, road-node-19, road-node-16]

