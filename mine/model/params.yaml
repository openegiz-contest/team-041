  design_tph: {<<: *kz2014, value: 4880, unit: t/h, status: sourced, title: "Проектная производительность конвейера", note: "С. 13."}
  installed_kw: {<<: *kz2014, value: 3640, unit: kW, status: sourced, title: "Установленная мощность приводов конвейера", note: "С. 13. Модель проверяет, что расчётная мощность на проектном потоке ниже установленной."}
