  capacity_t: {<<: *derived, value: 42684, unit: t, status: derived, title: "Активная вместимость склада дроблёной руды", note: "12 часов × 3557 т/ч = 42 684 т."}
  restart_hours: {<<: *assumed, value: 0.5, unit: h, status: assumption, title: "Запас руды, при котором остановленная мельница запускается снова", note: "Чтобы мельница не включалась и не выключалась на каждом самосвале."}

rom:
  reclaim_tph: {<<: *assumed, value: 1000, unit: t/h, status: assumption, title: "Подача руды со склада в дробилку погрузчиком",
    note: "Один фронтальный погрузчик класса Caterpillar 993K (в списке техники Бозшаколя 2015 года — 993K); источник производительности не найден."}
  reclaim_below_pct: {<<: *assumed, value: 25, unit: "%", status: assumption, title: "Уровень склада дроблёной руды, ниже которого начинают подачу со склада богатой руды", note: "Правило смены."}
  reclaim_stop_pct: {<<: *assumed, value: 40, unit: "%", status: assumption, title: "Уровень склада дроблёной руды, при котором подачу со склада прекращают", note: "Правило смены."}
  rehandle_diesel_l_t: {<<: *assumed, value: 0.25, unit: l/t, status: assumption, title: "Расход дизельного топлива погрузчика на перевалку",
    note: "Источник не найден. Фронтальный погрузчик класса 993–994 при подаче 1000 т/ч расходует около 250 л/ч: 0,25 л на тонну, поданную со склада в дробилку или на ОФ-2. Учитывается в стоимости перевалки и в выбросах CO₂."}
  rehandle_other_kzt_t: {<<: *assumed, value: 120, unit: KZT/t, status: assumption, title: "Прочие затраты перевалки руды через склад",
    note: "Источник не найден. Машинист, шины, ремонт погрузчика и планировка склада, около 0,27 USD/t. Вместе с топливом перевалка стоит 0,25 × 352 + 120 = 208 тг/т (около 0,46 USD/t), в обычном для перевалки со склада диапазоне 0,3–1 USD/t."}
  rehandle_kzt_t: {<<: *derived, value: 208, unit: KZT/t, status: derived, title: "Стоимость перевалки тонны руды через склад",
    note: "Топливо погрузчика 0,25 л/т × 352 тг/л = 88 тг/т плюс прочие затраты 120 тг/т = 208 тг/т. Начисляется на каждую тонну, поданную погрузчиком со склада в дробилку ОФ-1 или в приёмный склад ОФ-2; руда, оставшаяся на складах к концу прогноза, оценивается за вычетом этой стоимости."}

