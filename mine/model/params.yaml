    note: "Не опубликована. Обычно 91–94 % для фабрик с МПСИ: плановые остановки на замену футеровки и ремонты. В модели фабрика не останавливается на плановые ремонты, поэтому производительность за год = часовая × 8760 ч × 0,92."}
