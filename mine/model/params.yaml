  use_of_availability: {<<: *hvi_metrics, value: 0.80, unit: "-", status: snippet, title: "Коэффициент использования исправного парка",
    note: "Диапазон 70–85 %: очереди, заправка, пересменка, остановки на время взрывов."}
  cycle_min: {<<: *derived, value: 25.0, unit: min, status: derived, title: "Расчётный рейс самосвала без очередей, среднее по парку",
    note: "Считает mine/sim/design_basis.py по модели на исходных забоях: путь с грузом и обратно по кратчайшим маршрутам с модельными скоростями, проезд по рабочей площадке, установка 45 с, 4 ковша по 30 с, установка и разгрузка; среднее по самосвалам, взвешенное по их расстановке. Забои: дно карьера 120 м — откатка руды 4,3 км, рейс 32,5 мин; уступ 150 м — 3,5 км, 27,4 мин; уступ 195 м (бедная руда на склад) — 3,4 км, 24,7 мин; уступ 240 м — 2,5 км, 21,0 мин; вскрыша с уступа 300 м на отвал — 2,3 км, 15,6 мин. Тест сверяет значение с моделью."}
  trucks: {<<: *derived, value: 32, unit: "-", status: derived, title: "Число самосвалов участка",
    note: "Сумма по забоям: самосвалов на забой = темп забоя × 1,10 × рейс забоя / 60 / (136 т × 0,85 × 0,80), округление вверх. Руда и бедная руда делятся поровну между четырьмя рудными забоями (по 1166 т/ч), вскрыша 1693 т/ч — на один забой: 8 + 7 + 6 + 5 + 6 = 32 самосвала (world.yaml, `fleet.allocation`). В проекте 2014 года — 18 на фабрику при рейсе около 20 минут; в карьере глубиной 255 м рейс длиннее и рейсов в год у самосвала 14 300 вместо 18 000."}
  shovel_rate_mtpa: {<<: *kz2014, value: 11, unit: Mt/yr, status: sourced, title: "Годовая выработка экскаватора по проекту",
    note: "С. 10: каждый из четырёх экскаваторов Hitachi 21 м3 вынимает 11 млн т горной массы в год."}
  shovels: {<<: *derived, value: 5, unit: "-", status: derived, title: "Число экскаваторов участка",
