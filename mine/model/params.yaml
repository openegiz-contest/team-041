# Equipment and process parameters of the Aktogay mine slice (part of the
# pit and sulphide concentrator line No. 1): the single source of every
# numeric constant of the model. docs/mine/parameters.md is generated from
# this file by build_params_doc.py; do not edit that document by hand.
#
# Every entry has:
#   value, unit
#   title   what the number is (Russian, shown in the document)
#   source  title of the source;  url  its address
#   status  sourced     the number was read in the source itself
#           snippet     the number comes from a search summary of the source; the source was not opened
#           derived     computed from other entries or from published figures; the arithmetic is in `note`
#           assumption  chosen by the project; the reasoning is in `note`
#   note    remarks (Russian)
#
# `_sources` holds the source records shared by several entries; an entry
# pulls one in with `<<: *name`.

_sources:
  kz25: &kz25
    source: "KAZ Minerals, Production report for the fourth quarter and full year 2025 (таблица AKTOGAY, с. 3)"
    url: "https://www.kazminerals.com/?attachment_id=6823"
  kaz: &kaz
    source: "KAZ Minerals, Production and Sales Report for the twelve months and fourth quarter ended 31 December 2024 (таблица AKTOGAY, с. 3)"
    url: "https://www.kazminerals.com/media/23240/q4-2024-production-report_final.pdf"
  kzwaste: &kzwaste
    source: "KAZ Minerals, Sustainability: Waste — таблица «Waste rock by asset (Mt)», Актогай 2024 год"
    url: "https://www.kazminerals.com/sustainability/environment/waste"
  kz2014: &kz2014
    source: "KAZ Minerals, Projects Update, 11 декабря 2014 года (раздел Бозшаколя, с. 9–30; с. 36: инженерные решения Актогая идентичны)"
    url: "https://www.kazminerals.com/media/2828/projects_update_111214.pdf"
  noaa: &noaa
    source: "Нормы ВМО 1991–2020, станция Актогай (Aqtogay-36619), NOAA; таблица климата статьи Википедии «Aktogay, East Kazakhstan Region» (вторичный источник)"
