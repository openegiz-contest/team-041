  drills: {<<: *derived, value: 3, unit: "-", status: derived, title: "Число буровых станков участка",
    note: "51,2 млн т / 2,56 т/м3 = 20,0 млн м3 в год; на скважину 6 × 7 × 15 = 630 м3 и 16,7 м бурения: 31 800 скважин, 530 км в год. Станок даёт 30,4 м/ч × 8760 ч × 0,70 = 186 км в год: 530 / 186 = 2,85, округлено вверх до 3."}
  trucks_2014: {<<: *kz2014, value: 18, unit: "-", status: sourced, title: "Самосвалов на одну фабрику в проекте 2014 года (для сравнения)",
    note: "С. 11: 18 самосвалов Caterpillar 785C, каждый в среднем 18 000 рейсов в год за первые десять лет (Бозшаколь; с. 36: решения Актогая идентичны)."}
