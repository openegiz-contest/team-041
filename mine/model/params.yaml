conveyor:
  belt_speed_ms: {<<: *kz2014, value: 5.0, unit: m/s, status: sourced, title: "Скорость ленты",
    note: "С. 13: конвейер дроблёной руды до фабрики FLSmidth, 3,8 км, лента 1,6 м, 4880 т/ч, 5 м/с (по базе Mining Data Online — 3 + 1,5 км). Задержка транспорта = длина / скорость."}
  design_tph: {<<: *kz2014, value: 4880, unit: t/h, status: sourced, title: "Проектная производительность конвейера", note: "С. 13."}
  installed_kw: {<<: *kz2014, value: 3640, unit: kW, status: sourced, title: "Установленная мощность приводов конвейера", note: "С. 13. Модель проверяет, что расчётная мощность на проектном потоке ниже установленной."}
  empty_kw: {<<: *assumed, value: 400, unit: kW, status: assumption, title: "Мощность холостого хода конвейера", note: "Около 11 % установленной мощности; источник не найден."}
  friction_coefficient: {<<: *assumed, value: 0.03, unit: "-", status: assumption, title: "Коэффициент сопротивления движению ленты",
    note: "Мощность = холостой ход + поток × g × (подъём + 0,03 × длина) / КПД привода."}
  drive_efficiency: {<<: *assumed, value: 0.90, unit: "-", status: assumption, title: "КПД привода конвейера", note: "Источник не найден."}

stockpile:
  live_hours: {<<: *ksm, value: 12, unit: h, status: assumption, title: "Активный запас склада дроблёной руды в часах питания мельницы",
    note: "Вместимость склада Актогая не опубликована. Принято 12 часов. В проектах медных фабрик встречается от 3 до 41 часа; ближайшие примеры: KSM 10 часов (30 000 т при 3000 т/ч), проект из отчёта Wheaton 9–14 часов."}
  capacity_t: {<<: *derived, value: 46020, unit: t, status: derived, title: "Активная вместимость склада дроблёной руды", note: "12 часов × 3835 т/ч = 46 020 т."}
  restart_hours: {<<: *assumed, value: 0.5, unit: h, status: assumption, title: "Запас руды, при котором остановленная мельница запускается снова", note: "Чтобы мельница не включалась и не выключалась на каждом самосвале."}

rom:
  reclaim_tph: {<<: *assumed, value: 1000, unit: t/h, status: assumption, title: "Подача руды со склада в дробилку погрузчиком",
    note: "Один фронтальный погрузчик класса Caterpillar 994 (в списке техники Актогая по базе Mining Data Online — 994K); источник производительности не найден."}
  reclaim_below_pct: {<<: *assumed, value: 25, unit: "%", status: assumption, title: "Уровень склада дроблёной руды, ниже которого начинают подачу со склада богатой руды", note: "Правило смены."}
  reclaim_stop_pct: {<<: *assumed, value: 40, unit: "%", status: assumption, title: "Уровень склада дроблёной руды, при котором подачу со склада прекращают", note: "Правило смены."}
  rehandle_diesel_l_t: {<<: *assumed, value: 0.25, unit: l/t, status: assumption, title: "Расход дизельного топлива погрузчика на перевалку",
    note: "Источник не найден. Фронтальный погрузчик класса 994 при подаче 1000 т/ч расходует около 250 л/ч: 0,25 л на тонну, поданную со склада в дробилку. Учитывается в стоимости перевалки и в выбросах CO₂."}
  rehandle_other_kzt_t: {<<: *assumed, value: 120, unit: KZT/t, status: assumption, title: "Прочие затраты перевалки руды через склад",
    note: "Источник не найден. Машинист, шины, ремонт погрузчика и планировка склада, около 0,27 USD/t. Вместе с топливом перевалка стоит 0,25 × 352 + 120 = 208 тг/т (около 0,46 USD/t), в обычном для перевалки со склада диапазоне 0,3–1 USD/t."}
  rehandle_kzt_t: {<<: *derived, value: 208, unit: KZT/t, status: derived, title: "Стоимость перевалки тонны руды через склад",
    note: "Топливо погрузчика 0,25 л/т × 352 тг/л = 88 тг/т плюс прочие затраты 120 тг/т = 208 тг/т. Начисляется на каждую тонну, поданную погрузчиком со склада в дробилку; руда, оставшаяся на складах к концу прогноза, оценивается за вычетом этой стоимости."}

mill:
  design_tph: {<<: *derived, value: 3835, unit: t/h, status: derived, title: "Уставка питания мельницы без модуля (рабочая производительность линии)",
    note: "Равна производительности линии во время работы `plan.mill_rate_tph`: 30,909 млн т (Sulphide 1, 2025 год) / (8760 ч × 0,92)."}
  sag_design_tph: {<<: *kz2014, value: 3425, unit: t/h, status: sourced, title: "Проектная производительность МПСИ (для сравнения)",
    note: "С. 16: FLSmidth 40 × 26 футов, 28 000 кВт при 9,31 об/мин, 3425 т/ч, безредукторный привод ABB/Alstom."}
  sag_installed_mw: {<<: *kz2014, value: 28, unit: MW, status: sourced, title: "Установленная мощность МПСИ", note: "С. 16; Mining Technology и Mining Data Online — также 28 МВт."}
  ball_mills: {<<: *kz2014, value: 2, unit: "-", status: sourced, title: "Число шаровых мельниц",
    note: "С. 17: две FLSmidth 28 × 44 фута по 22 000 кВт при 10,99 об/мин, по 1706 т/ч."}
  ball_installed_mw: {<<: *kz2014, value: 44, unit: MW, status: sourced, title: "Установленная мощность шаровых мельниц, всего", note: "С. 17: 2 × 22 МВт."}
  installed_mw: {<<: *derived, value: 72, unit: MW, status: derived, title: "Установленная мощность мельниц",
    note: "МПСИ 28 + шаровые 2 × 22 = 72 МВт. Наибольшее питание = 72 000 кВт / удельная энергия для текущей крепости руды."}
  drive_load: {<<: *assumed, value: 0.875, unit: "-", status: assumption, title: "Загрузка приводов мельниц на рабочей производительности при опорной крепости",
    note: "Не опубликована. Приводы мельниц обычно работают на 85–90 % установленной мощности; запас до предела по мощности 1 / 0,875 = 14 %."}
  specific_energy_kwh_t: {<<: *derived, value: 16.43, unit: kWh/t, status: derived, title: "Удельный расход энергии на измельчение при опорной крепости",
    note: "72 000 кВт × 0,875 / 3835 т/ч = 16,43 кВт·ч/т. Для сравнения: проект 2014 года допускает до 28 000 / 3425 + 44 000 / 3412 = 8,2 + 12,9 кВт·ч/т на пределе мощности; Huckleberry — 18,3 кВт·ч/т."}
  bwi_ref_kwh_t: {<<: *derived, value: 14.0, unit: kWh/t, status: derived, title: "Опорный индекс работы Бонда",
    note: "Равен среднему индексу месторождения. По закону Бонда удельная энергия пропорциональна индексу: энергия = 16,43 × индекс / 14."}
  sag_kwh_t: {<<: *derived, value: 6.39, unit: kWh/t, status: derived, title: "Удельный расход энергии МПСИ при опорной крепости",
    note: "Доля МПСИ в установленной мощности 28 / 72: 16,43 × 28 / 72 = 6,39 кВт·ч/т; обе ступени загружены одинаково (по 87,5 %)."}
  ball_kwh_t: {<<: *derived, value: 10.04, unit: kWh/t, status: derived, title: "Удельный расход энергии шаровых мельниц при опорной крепости",
    note: "16,43 × 44 / 72 = 10,04 кВт·ч/т; 6,39 + 10,04 = 16,43."}
  charge_idle_pct: {<<: *assumed, value: 25, unit: "%", status: assumption, title: "Заполнение барабана МПСИ после домола",
    note: "Объёмная доля барабана, занятая шарами и рудой. Обычный рабочий диапазон МПСИ 25–35 % объёма; нижняя граница — мельница, измельчившая всё, что в ней было."}
  charge_full_pct: {<<: *assumed, value: 30, unit: "%", status: assumption, title: "Заполнение барабана МПСИ при работе на пределе мощности",
    note: "Середина диапазона 25–35 %: заполнение растёт с питанием от 25 % (пустой цикл) до 30 % (питание, равное пределу по мощности)."}
  charge_trip_pct: {<<: *assumed, value: 35, unit: "%", status: assumption, title: "Заполнение барабана МПСИ при отключении питания по перегрузу",
    note: "Верхняя граница диапазона 25–35 %: руда, поданная сверх того, что цикл успевает измельчить, поднимает заполнение от 30 до 35 %; при 35 % (перегруз 650 т) питание отключается."}
  setpoint_max_factor: {<<: *assumed, value: 1.15, unit: "-", status: assumption, title: "Наибольшая уставка питания, доля рабочей производительности", note: "Уставки выше отклоняются; фактическое питание ограничено ещё и мощностью."}
  min_feed_factor: {<<: *assumed, value: 0.6, unit: "-", status: assumption, title: "Наименьшее устойчивое питание мельницы, доля рабочей производительности",
    note: "Ниже этого питания мельницу полусамоизмельчения не ведут: шары бьют по футеровке. Модуль управления фабрикой не снижает уставку ниже 0,6 × 3835 = 2301 т/ч."}
  overload_t: {<<: *assumed, value: 650, unit: t, status: assumption, title: "Перегруз мельницы, при котором питание отключается",
    note: "Если уставка питания выше того, что мельница успевает измельчить на установленной мощности, избыток копится в барабане. При таком избытке питание отключается, пока мельница не измельчит накопленное. Источник не найден; порядок величины рудной загрузки МПСИ 40 футов."}
  restart_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "Пуск мельницы после остановки",
    note: "После остановки из-за пустого склада мельница принимает руду не раньше чем через это время. Источник не найден."}

flotation:
  recovery_ref_pct: {<<: *kz25, value: 87.2, unit: "%", status: sourced, title: "Извлечение меди при опорных условиях",
    note: "Извлечение Актогая за 2025 год при содержании 0,41 %; модель относит его к содержанию 0,41 % и индексу Бонда 14. Для сравнения: 87,9 % в 2024 году (0,43 %), 87,7 % в 2023 году (0,50 %)."}
  grade_gain_pct: {<<: *kz25, value: 3.2, unit: "%", status: derived, title: "Рост извлечения с содержанием",
    note: "Извлечение = 87,2 + 3,2 × ln(содержание / 0,41) − 20 × (индекс Бонда / 14 − 1). Коэффициент подобран методом наименьших квадратов по опубликованным точкам Актогая, проходящим через 2025 год (0,41 %; 87,2 %): 2024 год (0,43; 87,9), 2023 год (0,50; 87,7), I квартал 2025 (0,42; 86,8), IV квартал 2025 (0,40; 86,6): Σx(y − 87,2) / Σx² = 0,138 / 0,0429 = 3,2. Связь слабая: на изменение содержания 0,40 → 0,50 % извлечение отвечает на 0,7 пункта."}
  hardness_loss_pct: {<<: *assumed, value: 20, unit: "%", status: assumption, title: "Потеря извлечения на более крепкой руде",
    note: "Руда крепче опорной на 10 % теряет 2 пункта извлечения: при той же мощности мельниц помол грубее. Численной зависимости в источниках нет."}
  recovery_min_pct: {<<: *assumed, value: 70, unit: "%", status: assumption, title: "Нижняя граница извлечения", note: "Ограничение формулы."}
  recovery_max_pct: {<<: *assumed, value: 92, unit: "%", status: assumption, title: "Верхняя граница извлечения", note: "Ограничение формулы."}
  overfeed_loss_pct: {<<: *assumed, value: 10, unit: "%", status: assumption, title: "Потеря извлечения при питании выше рабочей производительности",
    note: "Время флотации сокращается обратно пропорционально потоку: питание на 10 % выше 3835 т/ч снимает 1 пункт извлечения. Численной зависимости в источниках нет."}
  conc_grade_pct: {<<: *assumed, value: 28, unit: "% Cu", status: assumption, title: "Содержание меди в концентрате",
    note: "KAZ Minerals содержание в концентрате не публикует. Внутри диапазона 26–31 % из испытаний порфировой руды (Valeriano) и рядом с 30 % на действующей фабрике."}
  energy_kwh_t: {<<: *ifactory, value: 2.6, unit: kWh/t, status: snippet, title: "Расход энергии на флотацию", note: "Из того же баланса: флотация 2,6 кВт·ч/т."}

concentrate:
  store_capacity_t: {<<: *assumed, value: 10000, unit: t, status: assumption, title: "Вместимость склада концентрата",
    note: "Источник не найден. Около 9 суток выпуска при 47 т/ч концентрата."}
  shipment_t: {<<: *assumed, value: 1400, unit: t, status: assumption, title: "Партия отгрузки концентрата",
    note: "Источник не найден. Состав из 20 вагонов по 70 т (концентрат отгружается по железной дороге, KAZ Minerals); при выпуске около 47 т/ч партия набирается примерно за 30 часов."}
  tails_density_t_m3: {<<: *assumed, value: 1.45, unit: t/m3, status: assumption, title: "Плотность уложенных хвостов",
    note: "Источник не найден. Сухая плотность намытых хвостов медной фабрики порядка 1,3–1,6 т/м3; нужна для объёма, который занимают хвосты."}

plant:
  aux_energy_kwh_t: {<<: *ifactory, value: 4.0, unit: kWh/t, status: derived, title: "Прочие потребители фабрики",
    note: "Всего 25,0 кВт·ч/т − мельницы 17,5 − флотация 2,6 − дробление и транспорт 0,9 = 4,0 кВт·ч/т: насосы, сгущение, хвосты."}
  aux_base_share: {<<: *assumed, value: 0.5, unit: "-", status: assumption, title: "Доля прочих потребителей, не зависящая от питания", note: "Половина нагрузки остаётся при остановленной мельнице."}

fuel_station:
  pumps: {<<: *assumed, value: 2, unit: "-", status: assumption, title: "Число постов заправки", note: "Источник не найден."}
  flow_l_min: {<<: *assumed, value: 400, unit: l/min, status: assumption, title: "Подача топлива", note: "Скоростная заправка карьерной техники; бак 1900 л заполняется за 4–5 минут."}
  position_min: {<<: *assumed, value: 3, unit: min, status: assumption, title: "Постановка на пост и подключение", note: "Источник не найден."}

workshop:
  bays: {<<: *assumed, value: 4, unit: "-", status: assumption, title: "Число ремонтных боксов",
    note: "Не опубликовано. На 32 самосвала: плановое ТО занимает 32 × 4 ч / 250 ч = 0,5 бокса, ремонт крупных отказов 32 × 12 ч / 512 ч = 0,75 бокса; с запасом на очередь — 4 бокса."}

reliability:
  truck_mtbf_h: {<<: *hvi_metrics, value: 500, unit: h, status: snippet, title: "Наработка самосвала на крупный отказ", note: "Среднее по отрасли 400–600 часов, лучшие парки более 1000."}
  truck_mttr_h: {<<: *hvi_metrics, value: 12, unit: h, status: snippet, title: "Среднее время ремонта крупного отказа", note: "Обычно 12–18 часов. Ремонт идёт в боксе мастерской."}
  truck_minor_mtbf_h: {<<: *assumed, value: 30, unit: h, status: assumption, title: "Наработка самосвала на мелкую неисправность",
    note: "Крупные отказы дают готовность 500 / 512 = 97,7 %, а отрасль сообщает 72–94 %: разницу составляют короткие остановки. Значение подобрано так, чтобы готовность парка была около 85 %: 1 − 12 / 512 − 4 / 34 = 0,86. Порядок величины тот же, что в исследовании бразильского парка (29 часов между остановками, 4 часа ремонта)."}
  truck_minor_mttr_h: {<<: *assumed, value: 4, unit: h, status: assumption, title: "Среднее время устранения мелкой неисправности",
    note: "Ремонт на месте выездной бригадой вместе с её ожиданием, бокс не нужен. Лучшие парки укладываются в 6 часов (тот же обзор)."}
  fix_minor_h: {<<: *assumed, value: 1.0, unit: h, status: assumption, title: "Устранение мелкой неисправности в боксе по заявке",
    note: "Дефект, найденный до отказа, устраняют в мастерской с готовыми запчастями: без ожидания выездной бригады и поиска причины. Источник не найден."}
  inspect_h: {<<: *assumed, value: 0.5, unit: h, status: assumption, title: "Осмотр в боксе, если дефект не подтвердился", note: "Цена ложной заявки на обслуживание."}
  pm_min_share: {<<: *assumed, value: 0.8, unit: "-", status: assumption, title: "Доля межсервисного интервала, после которой заявка выполняется как полное ТО",
    note: "Машина, попавшая в бокс после 0,8 × 250 = 200 моточасов, проходит плановое обслуживание целиком; до этого устраняется только найденный дефект."}
  pm_interval_h: {<<: *hvi_pm, value: 250, unit: h, status: snippet, title: "Периодичность планового обслуживания", note: "ТО-1 каждые 250 моточасов."}
  pm_duration_h: {<<: *hvi_pm, value: 4, unit: h, status: snippet, title: "Длительность планового обслуживания", note: "4–6 часов в мастерской."}
  overdue_hazard_slope: {<<: *assumed, value: 1.0, unit: "-", status: assumption, title: "Рост частоты отказов при просроченном обслуживании",
    note: "После 250 часов без обслуживания частота отказов растёт линейно и удваивается к 500 часам. Источник не найден."}
  pf_interval_major_h: {<<: *assumed, value: 24, unit: h, status: assumption, title: "Время развития крупного отказа",
    note: "От появления дефекта до отказа: всё это время растут температура двигателя или шин и падает показатель состояния, так что отказ можно предупредить обслуживанием."}
  pf_interval_minor_h: {<<: *assumed, value: 4, unit: h, status: assumption, title: "Время развития мелкой неисправности", note: "То же для коротких остановок."}
  sudden_share_pct: {<<: *assumed, value: 10, unit: "%", status: assumption, title: "Доля дефектов, которые не видны заранее",
    note: "Порванный рукав, пробитая шина, электрика: такой дефект сразу кончается отказом, и никакой контроль состояния не успевает поставить машину в бокс. Источник доли не найден. Без этой доли модуль техобслуживания успевал бы предупредить все отказы и готовность парка с модулями выходила бы за 95 %, выше лучших рудников (92–94 %, `plan.availability`). С долей 10 % готовность за неделю со всеми модулями — 93,3 %, без модулей — 87,2 % (зерно `sim.seed`, тест `test_modules`; на других зёрнах со всеми модулями — 92–93 %)."}
  repair_log_sigma: {<<: *assumed, value: 0.5, unit: "-", status: assumption, title: "Разброс длительности ремонта", note: "Логнормальное распределение со средним, равным среднему времени ремонта."}
  wear_pct_per_pm_interval: {<<: *assumed, value: 15, unit: "%", status: assumption, title: "Износ за межсервисный интервал", note: "Показатель состояния падает на 15 пунктов за 250 часов и восстанавливается обслуживанием."}
  health_drop_major_pct: {<<: *assumed, value: 30, unit: "%", status: assumption, title: "Падение показателя состояния перед крупным отказом", note: "Нарастает за время развития отказа."}
  health_drop_minor_pct: {<<: *assumed, value: 10, unit: "%", status: assumption, title: "Падение показателя состояния перед мелкой неисправностью", note: "Нарастает за время развития неисправности."}
  engine_fault_rise_c: {<<: *assumed, value: 10, unit: "°C", status: assumption, title: "Рост температуры двигателя при дефекте системы охлаждения", note: "К моменту отказа; пороги изготовителя двигателя не найдены."}
  tyre_fault_rise_c: {<<: *assumed, value: 15, unit: "°C", status: assumption, title: "Рост температуры шин при дефекте ходовой части", note: "К моменту отказа."}
  loader_mtbf_h: {<<: *hvi_uptime, value: 500, unit: h, status: snippet, title: "Наработка экскаватора на отказ", note: "Экскаваторы и погрузчики: среднее по отрасли 400–600 часов."}
  loader_mttr_h: {<<: *assumed, value: 8, unit: h, status: assumption, title: "Среднее время ремонта экскаватора", note: "Источник не найден. Ремонт идёт в забое."}

weather:
  oct_mean_c: {<<: *noaa, value: 7.6, unit: "°C", status: sourced, title: "Средняя суточная температура октября", note: "Строка Daily mean. Отнесена к 15 октября."}
  oct_max_c: {<<: *noaa, value: 15.4, unit: "°C", status: sourced, title: "Средний максимум октября", note: "Строка Mean daily maximum."}
  oct_min_c: {<<: *noaa, value: 1.3, unit: "°C", status: sourced, title: "Средний минимум октября", note: "Строка Mean daily minimum."}
  oct_precip_mm: {<<: *noaa, value: 20.0, unit: mm, status: sourced, title: "Осадки за октябрь", note: "Строка Average precipitation."}
  oct_wet_days: {<<: *noaa, value: 4.4, unit: "-", status: sourced, title: "Дней с осадками не меньше 1 мм в октябре", note: "Строка Average precipitation days (≥ 1,0 мм)."}
  nov_mean_c: {<<: *noaa, value: -2.0, unit: "°C", status: sourced, title: "Средняя суточная температура ноября", note: "Отнесена к 15 ноября. 26 октября, в день начала модели: 7,6 + (−2,0 − 7,6) × 11 / 31 = 4,2 °C."}
  nov_max_c: {<<: *noaa, value: 3.9, unit: "°C", status: sourced, title: "Средний максимум ноября", note: "Строка Mean daily maximum."}
  nov_min_c: {<<: *noaa, value: -6.5, unit: "°C", status: sourced, title: "Средний минимум ноября", note: "Строка Mean daily minimum."}
  nov_precip_mm: {<<: *noaa, value: 26.9, unit: mm, status: sourced, title: "Осадки за ноябрь", note: "Строка Average precipitation."}
  nov_wet_days: {<<: *noaa, value: 5.8, unit: "-", status: sourced, title: "Дней с осадками не меньше 1 мм в ноябре", note: "Строка Average precipitation days."}
  annual_precip_mm: {<<: *noaa, value: 195.6, unit: mm, status: sourced, title: "Осадки за год (для сравнения)", note: "Строка Year: полупустынный климат, сильные осадки редки."}
  warmest_hour: {<<: *assumed, value: 15, unit: h, status: assumption, title: "Самый тёплый час суток",
    note: "Температура меняется по синусоиде между средними минимумом и максимумом дня: максимум около 15 часов, минимум в 3 часа ночи."}
  wet_event_h: {<<: *assumed, value: 4, unit: h, status: assumption, title: "Длительность обычных осадков",
    note: "Нормы дают число дней с осадками и их количество, но не длительность. Осадки дня выпадают за 4 часа: в конце октября 20,0 / 4,4 = 4,5 мм за день, около 1,1 мм/ч — слабый дождь или мокрый снег."}
  snow_below_c: {<<: *assumed, value: 1.0, unit: "°C", status: assumption, title: "Температура воздуха, ниже которой осадки выпадают снегом", note: "Обычная граница дождя и снега у поверхности."}
  visibility_dry_m: {<<: *assumed, value: 10000, unit: m, status: assumption, title: "Видимость в сухую погоду", note: "Источник не найден."}
  visibility_light_m: {<<: *assumed, value: 4000, unit: m, status: assumption, title: "Видимость при слабых осадках", note: "Источник не найден."}
  visibility_rain_m: {<<: *assumed, value: 1000, unit: m, status: assumption, title: "Видимость в сильный дождь с мокрым снегом", note: "Источник не найден."}
  rain_heavy_mm_h: {<<: *assumed, value: 4, unit: mm/h, status: assumption, title: "Интенсивность сильного дождя с мокрым снегом (сценарий)",
    note: "Для полупустыни с 20 мм осадков за октябрь сильное событие — 10–15 мм за несколько часов, то есть около 4 мм/ч: столько выпадает за 3–4 часа, сколько за три обычных дня с осадками. Ливни 15 мм/ч и выше для Актогая в конце октября неправдоподобны."}
  rain_heavy_max_mm_h: {<<: *assumed, value: 15, unit: mm/h, status: assumption, title: "Наибольшая интенсивность, которую принимает сценарий", note: "Запросы сценария с большей интенсивностью отклоняются."}
  heavy_event_h: {<<: *derived, value: 3, unit: h, status: derived, title: "Ожидаемая длительность сильных осадков (сценарий)",
    note: "Сильное событие для Актогая в конце октября — 10–15 мм (`weather.rain_heavy_mm_h`): 12 мм / 4 мм/ч = 3 ч. После осадков дороги сохнут ещё `road.drying_min`, так что крутой съезд закрыт около 3,5 ч."}

sim:
  seed: {<<: *assumed, value: 20261026, unit: "-", status: assumption, title: "Зерно генератора случайных чисел", note: "Настройка проекта, не физическая величина: одинаковое зерно даёт одинаковый ход модели."}
  default_speedup: {<<: *assumed, value: 20, unit: "x", status: assumption, title: "Ускорение времени по умолчанию", note: "Настройка проекта: 20 секунд модели за секунду стенда; смена в 12 часов модели проходит за 36 минут, так что на стенде видно и отдельные рейсы, и последствия инцидента для фабрики. Допустимые значения 1, 10, 20 и 60 (сообщение `set-speed`)."}
  kpi_window_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Окно усреднения показателей", note: "Настройка проекта: показатели рудника считаются за последний час модели."}
  availability_window_h: {<<: *assumed, value: 24, unit: h, status: assumption, title: "Окно усреднения готовности парка самосвалов",
    note: "Настройка проекта: готовность — показатель за длинный срок, за один час она скачет от того, сколько машин именно сейчас в боксах. На двойнике рудника она считается за последние сутки модели (в первые сутки — с запуска)."}
  history_from_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "С какой минуты разгона модель ведёт историю для сравнения сценариев",
    note: "Модель начинает с самосвалов, стоящих в узлах дорог, и первые полчаса разгона (`world.yaml`, `clock.warm_start_min` = 120 мин) показатели выходят на обычный уровень. Эти минуты в историю не пишутся: после перезапуска симулятора окна «до» сценария строятся по 90 минутам установившейся работы."}
  rate_window_min: {<<: *assumed, value: 15, unit: min, status: assumption, title: "Окно усреднения производительности машин", note: "Настройка проекта: производительность экскаваторов и дробилки считается за последние 15 минут модели."}
  decision_timeout_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "Срок действия решения модуля без подтверждения",
    note: "Настройка проекта. Модули повторяют свои решения не реже раза в 10 минут модели; решение, не подтверждённое за 30 минут, симулятор снимает и возвращается к базовому правилу, так что остановленный сервис модуля не оставляет после себя устаревших уставок."}

dispatch:
  proportion_window_h: {<<: *assumed, value: 6, unit: h, status: assumption, title: "Окно учёта соотношения руды и вскрыши",
    note: "Доля руды в погруженной горной массе считается за последние 6 часов и сравнивается с плановой (`plan.ore_share`)."}
  proportion_gain_min: {<<: *assumed, value: 300, unit: min, status: assumption, title: "Цена отклонения от планового соотношения",
    note: "Отклонение доли руды на 1 пункт равноценно 3 минутам лишнего времени рейса: при выборе экскаватора модуль прибавляет эту цену к времени пути, очереди и погрузки."}
  stockpile_full_pct: {<<: *assumed, value: 95, unit: "%", status: assumption, title: "Уровень склада дроблёной руды, выше которого руда не требуется",
    note: "Когда склад заполнен и дробилка пропускает только то, что берёт мельница, отставание по руде не засчитывается: свободные самосвалы уходят на вскрышу, а не в очередь у дробилки."}
  stockpile_low_pct: {<<: *assumed, value: 60, unit: "%", status: assumption, title: "Уровень склада дроблёной руды, ниже которого руда нужна в полной плановой доле",
    note: "Между 60 и 95 % потребность в руде растёт линейно от полной до нулевой: так поток руды подстраивается под то, что берёт мельница, а склад держится в этом диапазоне."}
  divert_wait_min: {<<: *assumed, value: 5, unit: min, status: assumption, title: "Цена разгрузки на рудный склад вместо дробилки",
    note: "Лишний путь до склада и обратно (около 1,5 мин) и последующая перевалка погрузчиком. Если ожидание у дробилки дольше, рейс уходит на рудный склад; при выборе экскаватора ожидание у дробилки учитывается не выше этой цены."}
  pad_max_pct: {<<: *assumed, value: 60, unit: "%", status: assumption, title: "Заполнение рудного склада, выше которого модуль на него не возит",
    note: "Склад остаётся буфером на время остановок экскаваторов и дробилки и не заполняется до отказа."}
  requeue_gain_min: {<<: *assumed, value: 4, unit: min, status: assumption, title: "Выигрыш, ради которого самосвал уводят из очереди к другому экскаватору", note: "Защита от частых переназначений."}
  replan_min: {<<: *assumed, value: 5, unit: min, status: assumption, title: "Период пересмотра очередей", note: "Настройка проекта."}

grade_control:
  target_pct: {<<: *derived, value: 0.41, unit: "% Cu", status: derived, title: "Плановое содержание меди в питании мельницы",
    note: "Равно среднему содержанию руды, идущей на фабрику (`geology.mean_head_grade_pct`, Актогай 2025 год)."}
  band_pct: {<<: *assumed, value: 0.03, unit: "% Cu", status: assumption, title: "Полуширина допустимой полосы содержания",
    note: "Полоса 0,38–0,44 % Cu: ±7 % от плана. Источник не найден; реагентный режим флотации настраивают под диапазон содержания в питании."}
  control_min: {<<: *assumed, value: 10, unit: min, status: assumption, title: "Период пересчёта шихты", note: "Настройка проекта."}
  horizon_h: {<<: *assumed, value: 2, unit: h, status: assumption, title: "Горизонт прогноза содержания на складе",
    note: "Содержание на складе через 2 часа = текущее + (содержание потока − текущее) × доля склада, которую поток заменит за это время."}
  hold_share: {<<: *assumed, value: 0.9, unit: "-", status: assumption, title: "Доля полосы, в которой модуль не вмешивается",
    note: "Пока прогноз остаётся в пределах план ± 0,9 × 0,03 = 0,393–0,447 % Cu, руда идёт прямо в дробилку; модуль меняет шихту, когда прогноз выходит за эти пределы."}
  full_feed_below_pct: {<<: *assumed, value: 50, unit: "%", status: assumption, title: "Уровень склада дроблёной руды, ниже которого руду с дробилки не снимают",
    note: "При низком складе важнее объём: модуль отправляет руду на рудные склады, только когда поток на дробилку остаётся не меньше питания мельницы."}
  rehandle_cost: {<<: *assumed, value: 0.15, unit: "-", status: assumption, title: "Цена перевалки через рудный склад",
    note: "Доля допустимой полосы содержания, которой равноценна перевалка всего потока руды через склад; удерживает модуль от лишней перевалки."}

plant_control:
  control_min: {<<: *assumed, value: 5, unit: min, status: assumption, title: "Период пересчёта уставки питания", note: "Настройка проекта."}
  power_margin: {<<: *assumed, value: 0.97, unit: "-", status: assumption, title: "Доля предельного по мощности питания, которую использует модуль",
    note: "Запас 3 % от перегруза мельницы при колебаниях крепости руды."}
  reserve_pct: {<<: *assumed, value: 15, unit: "%", status: assumption, title: "Неснижаемый запас склада дроблёной руды",
    note: "15 % × 46 020 т = 6903 т, около 1,8 часа питания мельницы."}
  horizon_h: {<<: *assumed, value: 4, unit: h, status: assumption, title: "Горизонт, на котором склад не должен опуститься до неснижаемого запаса",
    note: "Уставка не выше, чем приход руды + (запас сверх неснижаемого) / 4 ч: при падении склада питание снижается заранее и плавно."}
  trend_window_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Окно оценки прихода руды на склад", note: "Настройка проекта."}

maintenance:
  deficit_alarm_pct: {<<: *assumed, value: 1.5, unit: "%", status: assumption, title: "Отставание показателя состояния от износа, с которого дефект считается обнаруженным",
    note: "Показатель состояния машины без дефекта следует износу: 100 − 15 × моточасы / 250. Отставание от этой линии больше 1,5 пункта при устойчивом росте означает развивающийся дефект."}
  slope_alarm_pct_h: {<<: *assumed, value: 0.5, unit: "%/h", status: assumption, title: "Скорость падения показателя состояния, с которой дефект считается развивающимся", note: "Отсекает шум округления показателя."}
  fast_slope_pct_h: {<<: *assumed, value: 1.9, unit: "%/h", status: assumption, title: "Скорость падения, отличающая быстрый дефект от медленного",
    note: "Мелкая неисправность: 10 пунктов за 4 ч = 2,5 пункта в час; крупный отказ: 30 пунктов за 24 ч = 1,25. Граница посередине."}
  urgent_h: {<<: *assumed, value: 2, unit: h, status: assumption, title: "Прогноз времени до отказа, при котором машину отправляют в бокс немедленно", note: "Остальные заявки ждут свободного бокса и своей очереди."}
  engine_residual_c: {<<: *assumed, value: 2.5, unit: "°C", status: assumption, title: "Превышение температуры двигателя над парком, указывающее на систему охлаждения",
    note: "Сравниваются средние за час температуры машины и медиана по парку."}
  tyre_residual_c: {<<: *assumed, value: 3.0, unit: "°C", status: assumption, title: "Превышение температуры шин над парком, указывающее на ходовую часть", note: "То же сравнение."}
  pm_lead_h: {<<: *assumed, value: 10, unit: h, status: assumption, title: "За сколько моточасов до срока модуль начинает искать окно для планового ТО",
    note: "С 240 моточасов машина ставится на ТО, как только в ремонте и обслуживании нет других машин; после 270 моточасов ставится в первый свободный бокс."}
  pm_overdue_h: {<<: *assumed, value: 20, unit: h, status: assumption, title: "Просрочка планового ТО, после которой окно больше не выбирают", note: "См. предыдущую строку."}
  planned_out_max: {<<: *assumed, value: 3, unit: "-", status: assumption, title: "Сколько машин одновременно выводится по несрочным заявкам",
    note: "Из четырёх боксов один остаётся свободным для аварийного ремонта."}

scenario:
  hard_ore_bwi: {<<: *assumed, value: 17.5, unit: kWh/t, status: assumption, title: "Индекс Бонда зоны крепкой руды",
    note: "Верхняя часть диапазона порфировых руд (5,7–20,2 кВт·ч/т), на 25 % выше среднего по месторождению."}
  hard_ore_ramp_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "Время, за которое крепкая руда вытесняет обычную в питании мельницы",
    note: "Зона приходит и уходит постепенно; после отмены сценария крепость возвращается за то же время."}
  kpi_window_max_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Наибольшее окно сравнения показателей сценария",
    note: "Показатели цепочки сценария считаются по двум окнам равной длины: «до» кончается в момент запуска, «сейчас» — в текущий момент; длина окна равна времени с запуска, но не больше 60 минут и не меньше 5 минут."}
  kpi_recovery_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Сколько минут после другого сценария окно «до» ещё не считается обычной работой",
    note: "После отмены сценария очереди, склады и рейсы приходят в обычное состояние не сразу: после остановки дробилки разбирается очередь и стоят мокрые дороги, после закрытия участка самосвалы возвращаются на свои маршруты. Окно «до», задетое другим сценарием или часом после него, не берётся: показатель сравнивается с последним чистым окном той же длины, а если такого нет, карточка пишет «база недоступна»."}
  route_trips_min: {<<: *assumed, value: 16, unit: "-", status: assumption, title: "Сколько рейсов после закрытия дороги нужно, чтобы показатели рейса считались по ним",
    note: "Рейс, начатый до закрытия, ещё прошёл по старому маршруту, а первыми после закрытия заканчиваются короткие рейсы; руда, разгруженная в дробилку за первые минуты, — это грузы, уже бывшие в пути. Пока не закончилось 16 рейсов, начатых после закрытия (половина парка), «сейчас» для пути с грузом, времени рейса и руды, разгруженной в дробилку, — прогноз по открытым маршрутам: значение «до», умноженное на отношение длины маршрута, времени рейса или провозной способности парка сейчас к ним же до закрытия; карточка помечает его как прогноз."}
  kpi_history_h: {<<: *assumed, value: 6, unit: h, status: assumption, title: "Глубина истории для оценки колебаний показателей",
    note: "Колебание показателя — среднеквадратичная разница между соседними окнами той же длины за последние часы перед запуском."}
  kpi_noise_k: {<<: *assumed, value: 2, unit: "-", status: assumption, title: "Во сколько раз изменение должно превышать обычное колебание",
    note: "Изменение показателя считается значимым, если оно больше двух среднеквадратичных разниц соседних окон; иначе текст пишет «в пределах колебаний»."}
  kpi_large_change_pct: {<<: *assumed, value: 30, unit: "%", status: assumption, title: "Изменение показателя, значимое без оценки колебаний",
    note: "Изменение на 30 % и больше от значения до запуска считается значимым, даже если короткие окна шумные; темп, упавший до нуля (дробилка встала), значим всегда. Так остановка дробилки или выемка, упавшая вдвое, не называется «в пределах колебаний»."}
  hard_ore_expected_h: {<<: *assumed, value: 12, unit: h, status: assumption, title: "Ожидаемая длительность зоны крепкой руды (сценарий)",
    note: "Крепкая руда приходит из забоя, вскрывшего зону: блок модели — около 200 тыс. т, мельница перерабатывает 3,8–4,2 тыс. т/ч смеси из четырёх рудных забоев. Сколько руды зоны в блоке, неизвестно; 12 ч — допущение, одна смена: в прогнозе на смену зона не кончается."}
  overrun_extend_share: {<<: *assumed, value: 0.5, unit: "-", status: assumption, title: "На какую долю ожидаемой длительности продлевается оценка, если инцидент её превысил",
    note: "На стенде сценарий идёт, пока его не отменят. Если ожидаемое окончание прошло, а сценарий ещё идёт, ремонт затянулся: новая оценка — сейчас плюс половина первоначальной длительности, и прогнозы считают уже от неё. Так начальник смены переспрашивает ремонтников о сроке."}
  kpi_large_min_window_min: {<<: *assumed, value: 10, unit: min, status: assumption, title: "Наименьшее окно, на котором крупное изменение считается значимым само по себе",
    note: "В окне 5 минут рейсов и самосвалов мало, и показатель по рейсам может случайно измениться на треть; с 10 минут правило крупного изменения действует."}

