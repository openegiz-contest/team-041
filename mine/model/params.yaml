    note: "Sulphide 1 переработала за 2025 год 30,909 млн т: 30 909 000 / (8760 ч × 0,92) = 3835 т/ч. Это на 12 % выше проектных 3425 т/ч мельницы 2014 года: KAZ Minerals сообщает, что обе фабрики работают выше проектной мощности."}
  ore_share: {<<: *derived, value: 0.734, unit: "-", status: derived, title: "Доля руды (с бедной) в горной массе", note: "1 / (1 + коэффициент вскрыши 0,363) = 0,734."}
  rock_tph: {<<: *derived, value: 6356, unit: t/h, status: derived, title: "Горная масса, которую должен вынимать парк участка",
    note: "Руда для мельницы 3835 т/ч × (1 + бедная руда 0,216) × (1 + вскрыша 0,363) = 3835 × 1,216 × 1,363 = 6356 т/ч: руда 3835, бедная руда 828, вскрыша 1693 т/ч. За год (8760 ч × 0,92) это 51,2 млн т горной массы."}
