# Heading and opening sentence of each group in docs/mine/parameters.md.

_groups:
  rock: {title: "Горная порода"}
  pit: {title: "Карьер",
    intro: "Подробную геометрию карьера Бозшаколь KAZ Minerals не публикует: ни углов бортов, ни трасс съездов. Известны размеры карьера по верху на 2023 год (4070 × 880 м), отметки этапов его углубки и глубина горного отвода 430 м (заявление о намечаемой деятельности 2023 года). Модель строит карьер по этим параметрам (`mine/model/layout.py`): бровка — «стадион» (две полуокружности, соединённые прямыми бортами) указанных размеров, уступы по 15 м с откосом и бермой, рабочие площадки разносок, съезды с постоянным уклоном вдоль длинных бортов. Глубина рабочего дна 225 м — допущение по этапам углубки."}
  geology: {title: "Геология и блочная модель",
    intro: "Содержание меди, крепость и глинистость блоков задаются гладкими случайными полями (`mine/model/geology.py`). Доли классов по тоннажу: вскрыша — по проектному коэффициенту вскрыши 0,7, забалансовая (бедная) руда — допущение, среднее содержание сульфидной руды — расчёт по отчёту KAZ Minerals за 2024 год. Глинистость — отдельная группа «Глинистая руда»."}
  clay: {title: "Глинистая руда",
    intro: "На Бозшаколе верхняя часть месторождения — кора выветривания с каолинизированной (глинистой) рудой; её перерабатывает отдельная фабрика ОФ-2, где руду отмывают от глины. Порогов глинистости и долей глины KAZ Minerals не публикует, поэтому глинистость блока в модели — допущение с объяснением: фон сульфидной руды, каолинизация, убывающая с глубиной, зоны каолинизации по разломам и усиление на западе месторождения (там, по местной прессе, более 30 млн т каолинизированного сырья). Блок с глинистостью от `clay.clay_ore_min_pct` и содержанием руды — глинистая руда; её медь — в 1,2 раза богаче сульфидной (как в IV квартале 2020 года)."}
  truck: {title: "Самосвал Caterpillar 785C",
    intro: "Модель самосвала — из проектного парка Бозшаколя (обзор проектов KAZ Minerals 2014 года: 18 самосвалов Caterpillar 785C грузоподъёмностью до 140 т). Скорость и расход топлива не задаются, а получаются из массы, мощности, уклона и сопротивления качению (`mine/common/physics.py`)."}
  loader: {title: "Экскаватор Hitachi EX3600E-6",
    intro: "В проекте Бозшаколя 2014 года — четыре электрических экскаватора Hitachi с ковшом 21 м3; EX3600E-6 — электрическое исполнение прямой лопаты Hitachi с ковшом 21 м3. Экскаваторы питаются от подстанции рудника."}
  drill: {title: "Бурение (Sandvik D55SP)", intro: "В проекте Бозшаколя 2014 года — четыре станка вращательного бурения Sandvik D55. Сетка скважин и высота уступа согласованы между собой по правилам справочника Dyno Nobel."}
  blast: {title: "Взрывные работы"}
  road: {title: "Дороги"}
  plan: {title: "Расчёт парка по фабрикам",
    intro: "Парк рассчитан по фабрикам: ОФ-1 и ОФ-2 должны получать руду со скоростью, с которой они её перерабатывают, а вместе с рудой забои вынимают забалансовую руду и вскрышу в проектной доле. Время рейса берётся из самой модели на исходных забоях (`mine/sim/design_basis.py`); тест проверяет, что числа этой группы и расстановка самосвалов в `world.yaml` совпадают с расчётом."}
  crusher: {title: "Первичная дробилка ОФ-1"}
  dump: {title: "Отвал и рудные склады"}
  conveyor: {title: "Конвейер"}
  stockpile: {title: "Склад дроблёной руды ОФ-1"}
  rom: {title: "Рудные склады и подача с них"}
  mill: {title: "Мельницы ОФ-1",
    intro: "Измельчение ОФ-1 по обзору проектов KAZ Minerals 2014 года: одна мельница полусамоизмельчения 40 × 26 футов (28 МВт) и две шаровые мельницы 28 × 44 фута (по 22 МВт), все с безредукторным приводом. Питатель подаёт руду со склада по уставке; пропускная способность цикла ограничена установленной мощностью 72 МВт, а на глинистом питании — ещё и вязкостью пульпы и налипанием (`mill.clay_handling_slope`); мощность делится между МПСИ и шаровыми мельницами в отношении их установленных мощностей."}
  flotation: {title: "Флотация ОФ-1"}
  clay_plant: {title: "Фабрика глинистых руд ОФ-2",
    intro: "ОФ-2 — «установка по отмывке руды от глины»: приёмный склад, дробление, МПСИ с частичным измельчением для разрушения глинистых агрегатов, обесшламливание гидроциклонами, шаровая мельница, песковая и шламовая флотация, общий с ОФ-1 склад концентрата и хвостохранилище (заключения ОВОС 2025 года). Производительность — по разрешению и отчёту за 2024 год; извлечение ОФ-2 KAZ Minerals не публикует, оно задано моделью обесшламливания и откалибровано так, чтобы извлечение рудника в целом за 2024 год (78,1 %) получалось из двух фабрик."}
  clay_stockpile: {title: "Склад глинистой руды"}
  concentrate: {title: "Концентрат и хвосты", intro: "Концентрат ОФ-1 и ОФ-2 после сгущения и фильтрации копится на общем складе и отгружается партиями; хвосты обеих фабрик идут в хвостохранилище. Масса концентрата = медь в концентрате / содержание меди в нём; хвосты = переработанная руда − концентрат."}
  plant: {title: "Прочие потребители фабрики"}
  fuel_station: {title: "Заправочная станция"}
  workshop: {title: "Мастерская"}
  reliability: {title: "Надёжность и обслуживание",
    intro: "Дефект появляется случайно, развивается и заканчивается отказом; пока он развивается, его видно по показателям состояния машины (`mine/sim/reliability.py`)."}
  weather: {title: "Погода",
    intro: "Погода следует климатическим нормам станции Экибастуз (1991–2020; ближайшая станция, 73 км к востоку от рудника) на дату модели: средние температуры месяцев отнесены к их серединам и интерполируются по дням, суточный ход — между средними максимумом и минимумом. Осадки выпадают случайно: вероятность дня с осадками и их количество — по нормам месяца (`mine/sim/weather.py`)."}
  sim: {title: "Настройки модели"}
  dispatch: {title: "Модуль диспетчеризации",
    intro: "Настройки сервиса `mine-dispatch` (`mine/modules/dispatch`): время пути, очереди и погрузки модуль считает сам по состоянию двойников, эти числа задают только пределы его решений."}
  grade_control: {title: "Модуль управления качеством руды", intro: "Настройки сервиса `mine-grade` (`mine/modules/grade`): содержание меди в питании ОФ-1 и куда направлять глинистую руду — на ОФ-2, в шихту ОФ-1 в пределах доли глины или на склад глинистой руды."}
  plant_control: {title: "Модуль управления фабрикой", intro: "Настройки сервиса `mine-plant` (`mine/modules/plant`)."}
  maintenance: {title: "Модуль техобслуживания",
    intro: "Настройки сервиса `mine-maint` (`mine/modules/maint`): пороги, по которым модуль отличает развивающийся дефект от обычного износа."}
  scenario: {title: "Сценарии «что если»"}
  economics: {title: "Деньги и выбросы CO₂",
    intro: "Переменная маржа рудника: выручка за оплачиваемую медь в концентрате обеих фабрик минус дизельное топливо самосвалов и электроэнергия рудника и фабрик. Труд, ремонт, взрывчатка, реагенты, амортизация и прочие постоянные затраты не учитываются. Цены и курс на октябрь 2026 года."}
  forecast: {title: "Прогноз «два будущих»", intro: "Настройки прогноза: симулятор копирует свою модель и прогоняет копию вперёд вместе с ядрами модулей (`mine/sim/forecast.py`). Маржа ветви — та же переменная маржа, что у рудника: выручка за медь минус дизель и электроэнергия за горизонт. Отдельно считается поправка на то, что горизонт оставляет следующей смене: вся руда между забоем и флотацией оценивается одинаково, сульфидная — по ОФ-1, глинистая — по ОФ-2 (группа «Деньги и выбросы CO₂», `economics.stock_kzt_t`). Советник и страница сравнивают варианты по сумме маржи и поправки — итогу с поправкой."}
  response: {title: "Ресурсы смены на инциденты",
    intro: "Рычаги начальника смены при инциденте, кроме тех, что уже ведут модули: вторая ремонтная бригада со специалистами подрядчика (на дробилку, экскаватор или ОФ-2), бригада мастерской в забое, грейдер с подсыпкой на мокрый съезд, аварийная дорожная бригада, сверхурочная смена мастерской. Каждый рычаг — живое сообщение двойнику, на который он действует (`mine/sim/response.py`); его цена входит в итог прогноза отдельной частью «ресурсы смены»."}
  advisor: {title: "Модуль-советник", intro: "Настройки сервиса `mine-advisor` (`mine/modules/advisor`): с каких значений состояние рудника считается инцидентом и на какой срок даются указания по его вариантам."}
  reference: {title: "Показатели рудника без модулей (для справки)",
    intro: "Измерены тестом `mine/tests/test_modules.py`: 7 суток модели без модулей, зерно из `sim.seed`; тест проверяет, что числа совпадают с прогоном. На стенде модули с этими числами не сравниваются: эффект модуля измеряется прогнозом «с модулем / без модуля» от одного и того же состояния рудника (группа «Прогноз»)."}

rock:
  insitu_density_t_m3: {<<: *dyno, value: 2.56, unit: t/m3, status: sourced, title: "Плотность породы в массиве",
    note: "С. 10, таблица свойств пород, строка «порфир». Плотность руды Бозшаколя не опубликована; для каолинизированной руды коры выветривания она, вероятно, ниже — модель этого не различает."}
  loose_density_t_m3: {<<: *hitachi, value: 1.8, unit: t/m3, status: sourced, title: "Насыпная плотность взорванной породы",
    note: "С. 17: ковш 21 м3 рассчитан на материал плотностью не более 1800 кг/м3. Коэффициент разрыхления 2,56 / 1,8 = 1,42."}

pit:
  face_angle_deg: {<<: *assumed, value: 65, unit: deg, status: assumption, title: "Угол откоса уступа",
    note: "Углы бортов карьера Бозшаколь не опубликованы. 65° — обычный угол откоса уступа высотой 15 м в скальных породах; в коре выветривания он, вероятно, положе — модель этого не различает."}
  berm_m: {<<: *assumed, value: 10, unit: m, status: assumption, title: "Ширина бермы на конечном борту",
    note: "Ширина бермы не опубликована. С откосом 65° (заложение 15 / tg 65° = 7,0 м) уступ занимает 17,0 м по горизонтали: угол конечного борта atan(15 / 17,0) = 41°, внутри обычных для порфировых карьеров 35–45°. Пятнадцать уступов отступают от бровки на 245 м, меньше полуширины карьера 440 м."}
  top_length_m: {<<: *eco29174, value: 4070, unit: m, status: sourced, title: "Длина карьера по верху (2023 год)",
    note: "С. 1, раздел 2: верх карьера около 4070 × 880 м. Бровка модели — «стадион» этих размеров (`world.yaml`)."}
  top_width_m: {<<: *eco29174, value: 880, unit: m, status: sourced, title: "Ширина карьера по верху (2023 год)", note: "Там же."}
  rim_elevation_m: {<<: *eco29174, value: 230, unit: m, status: derived, title: "Отметка поверхности у карьера",
    note: "С. 1: карьер отработан до отметки +40 м, глубина до неё 190 м: поверхность около +40 + 190 = +230 м. Отметка самой площадки рудника не найдена; бровка модели +230 м."}
  depth_m: {<<: *assumed, value: 225, unit: m, status: assumption, title: "Глубина рабочего дна карьера от бровки",
    note: "По плану горных работ (с. 1) второй этап углубки (2018–2024) — до отметки 0 м, третий (2021–2033) — до −40 м. Рабочее дно модели принято на +5 м (15 уступов от бровки +230 м): уступ над отметкой второго этапа; на конец 2026 года дно карьера, вероятно, уже ниже. Ниже нуля модель не опускается: высотная система отметок рудника не опубликована."}
  final_depth_m: {<<: *eco29174, value: 430, unit: m, status: sourced, title: "Глубина горного отвода (для сравнения)",
    note: "С. 2, раздел 4: площадь горного отвода 8,19 км², глубина 430 м; шестой этап (2027–2063) — до отметки −200 м: 230 + 200 = 430 м."}
  licence_area_km2: {<<: *eco29174, value: 8.19, unit: km2, status: sourced, title: "Площадь горного отвода (для сравнения)",
    note: "С. 2, раздел 4. Карьер модели по верху 4070 × 880 м занимает 3,4 км² (площадь «стадиона»)."}

geology:
  mean_head_grade_pct: {<<: *kz24, value: 0.39, unit: "% Cu", status: derived, title: "Среднее содержание меди в сульфидной руде (питание ОФ-1)",
    note: "Переработано 34 755 тыс. т при 0,40 % Cu (2024 год). Раздельно по фабрикам содержание не публикуется; в IV квартале 2020 года глинистая руда была богаче сульфидной в 0,61 / 0,51 = 1,2 раза (`clay.clay_grade_factor`). Если ОФ-2 переработала столько, сколько добыто глинистой руды (6086 тыс. т), то 28 669 × g + 6086 × 1,2 g = 34 755 × 0,404 (0,404 — содержание, при котором медь в концентрате 109,6 тыс. т при извлечении 78,1 %): g = 0,39 %, у глинистой руды 0,47 %."}
  cutoff_grade_pct: {<<: *kz2014, value: 0.20, unit: "% Cu", status: sourced, title: "Бортовое содержание",
    note: "С. 45: ресурсы 2014 года (1173 млн т при 0,35 % Cu) подсчитаны при бортовом содержании 0,2 % Cu. Блоки ниже борта идут в отвал."}
  low_grade_below_pct: {<<: *assumed, value: 0.28, unit: "% Cu", status: assumption, title: "Верхняя граница забалансовой (бедной) руды",
    note: "Не опубликована. Руда от бортового содержания до этой границы идёт на склад забалансовой руды (по плану горных работ 2025 года её добывается 20,7 млн т в год, ecoportal 66983, с. 11); граница выбрана так, чтобы руда выше неё в среднем содержала 0,39 % при разбросе ниже."}
  design_strip_ratio: {<<: *kz2014, value: 0.7, unit: t/t, status: sourced, title: "Проектный коэффициент вскрыши (вскрыша и забалансовая руда на тонну руды)",
    note: "С. 11: проектный коэффициент вскрыши за срок отработки 0,7 : 1. При 34,7 млн т руды в год он даёт 59,1 млн т горной массы — как текущий план горных работ на 2024 год (60,4 млн т, ecoportal 29174, с. 2). Скорректированный план (87,8 млн т на 2025 год, 41,6 млн т вскрыши и 20,7 млн т забалансовой руды, ecoportal 66983, с. 11) модель не воспроизводит: парк рассчитан по проекту."}
  strip_ratio: {<<: *derived, value: 0.545, unit: t/t, status: derived, title: "Вскрыша на тонну добытой руды (с забалансовой) в блочной модели",
    note: "Проектные 0,7 т сверх руды для фабрик делятся на забалансовую руду (`geology.low_grade_share`, 0,10) и вскрышу: (1 + 0,7) / (1 + 0,10) − 1 = 0,545 т вскрыши на тонну добытой руды с забалансовой. Доля вскрыши в горной массе 0,545 / 1,545 = 35 %; вскрыша с забалансовой рудой на тонну руды для фабрик — 0,70."}
  low_grade_share: {<<: *assumed, value: 0.10, unit: t/t, status: assumption, title: "Забалансовая руда на тонну руды, идущей на фабрики",
    note: "Порог забалансовой руды Бозшаколя не опубликован. 0,10 т/т — допущение внутри проектных 0,7 т горной массы сверх руды (`geology.design_strip_ratio`), чтобы класс и склад забалансовой руды работали. По скорректированному плану 2025 года забалансовой руды 20,7 млн т на 35,5 млн т руды (0,58 т/т): так много модель не возит."}
  ore_grade_log_sigma: {<<: *assumed, value: 0.6, unit: "-", status: assumption, title: "Разброс содержания в руде (сигма логнормального распределения)",
    note: "Превышение содержания над границей забалансовой руды распределено логнормально; при сигме 0,6 рудные блоки лежат примерно от 0,30 до 0,55 % Cu."}
  waste_grade_min_share: {<<: *assumed, value: 0.15, unit: "-", status: assumption, title: "Содержание в самой бедной вскрыше, доля бортового",
    note: "Вскрышные блоки получают содержание от этой доли бортового до верхней доли."}
  waste_grade_max_share: {<<: *assumed, value: 0.95, unit: "-", status: assumption, title: "Содержание в самой богатой вскрыше, доля бортового",
    note: "Чуть ниже борта, чтобы класс блока не зависел от округления."}
  correlation_length_m: {<<: *assumed, value: 250, unit: m, status: assumption, title: "Радиус корреляции содержания, крепости и глинистости",
    note: "Соседние блоки (115 × 50 м) получают близкие значения; через несколько сотен метров связь пропадает."}
  wavelength_min_factor: {<<: *assumed, value: 2, unit: "-", status: assumption, title: "Самая короткая волна поля, в радиусах корреляции",
    note: "Поле складывается из плоских волн случайного направления с длиной от 2 до 6 радиусов корреляции (500–1500 м)."}
  wavelength_max_factor: {<<: *assumed, value: 6, unit: "-", status: assumption, title: "Самая длинная волна поля, в радиусах корреляции",
    note: "См. предыдущую строку."}
  bwi_mean_kwh_t: {<<: *assumed, value: 14.0, unit: kWh/t, status: assumption, title: "Средний индекс работы Бонда",
    note: "Для Бозшаколя не опубликован. Порфировые руды в обзоре: 5,7–20,2 кВт·ч/т (Сарчешме), около 13 (два месторождения SAGDesign); взята середина. Глинистость на индекс Бонда в модели не влияет: глина действует на пропускную способность через вязкость пульпы (`mill.clay_handling_slope`)."}
  bwi_sd_kwh_t: {<<: *assumed, value: 1.2, unit: kWh/t, status: assumption, title: "Стандартное отклонение индекса Бонда между блоками",
    note: "Даёт блоки примерно от 11,5 до 16,5 кВт·ч/т, внутри диапазона порфировых руд."}
  bwi_min_kwh_t: {<<: *assumed, value: 10.5, unit: kWh/t, status: assumption, title: "Нижняя граница индекса Бонда", note: "Ограничение хвоста распределения."}
  bwi_max_kwh_t: {<<: *assumed, value: 18.0, unit: kWh/t, status: assumption, title: "Верхняя граница индекса Бонда", note: "Ограничение хвоста распределения."}

clay:
  clay_ore_min_pct: {<<: *assumed, value: 15, unit: "%", status: assumption, title: "Глинистость, с которой рудный блок считается глинистой рудой",
    note: "Порог KAZ Minerals не публикует (поиск по заключениям ОВОС и отчётам ничего не дал). 15 % глинистых минералов (каолинит, иллит) — уровень, при котором руду уже не направляют на сульфидную фабрику без отмывки: шламы покрывают сульфиды и снижают их флотируемость (`onemine`, аннотация TMS 1999), а пульпа становится вязкой. Блок руды с глинистостью от 15 % — класс «глинистая руда», по плану горных работ он идёт на ОФ-2."}
  sulphide_clay_pct: {<<: *assumed, value: 3.0, unit: "%", status: assumption, title: "Фоновая глинистость сульфидной руды",
    note: "Глинистые минералы в первичной (сульфидной) руде порфировых месторождений — обычно единицы процентов (серицит, глинистая изменённость по трещинам). Среднее по блокам, логнормальный разброс — следующая строка."}
  sulphide_clay_sigma: {<<: *assumed, value: 0.35, unit: "-", status: assumption, title: "Разброс фоновой глинистости (сигма логнормального распределения)",
    note: "Даёт сульфидные блоки примерно от 1,5 до 6 % глины."}
  kaolin_clay_pct: {<<: *assumed, value: 40, unit: "%", status: assumption, title: "Глинистость полностью каолинизированной руды",
    note: "Каолинизированная руда коры выветривания: порфир, полевые шпаты которого замещены каолинитом; доля глинистых минералов в такой руде — десятки процентов. 40 % — допущение; в модели это верхний предел глинистости блока."}
  weathering_depth_m: {<<: *assumed, value: 60, unit: m, status: assumption, title: "Масштаб убывания каолинизации с глубиной",
    note: "Кора выветривания порфировых месторождений Центрального Казахстана — десятки метров. Вклад глубины в каолинизацию — exp(−глубина / 60 м): у бровки 1, на глубине 60 м 0,37, на 135 м 0,11."}
  kaolin_from: {<<: *assumed, value: 0.40, unit: "-", status: assumption, title: "Показатель каолинизации, с которого руда начинает глиниться",
    note: "Показатель = exp(−глубина / 60 м) + западная прибавка + зоны. Ниже 0,40 блок сохраняет фоновую глинистость, от 0,40 до 0,70 глинистость растёт линейно до 40 %. Без зон и западной прибавки: уступ 215 м (глубина 15 м) — 40 % глины, 200 м — около 29 %, 185 м — около 12 %, ниже 170 м — фон. В блочной модели (первая выемка и семь разносок рабочих уступов) глинистая руда — 17,5 % горной массы при средней глинистости 34 %, сульфидная руда — 3,4 % глины."}
  kaolin_full: {<<: *assumed, value: 0.70, unit: "-", status: assumption, title: "Показатель каолинизации полностью глинистой руды", note: "См. предыдущую строку."}
  zone_amp: {<<: *assumed, value: 0.25, unit: "-", status: assumption, title: "Вклад зон каолинизации по разломам",
    note: "Гладкое случайное поле с единичным разбросом, умноженное на 0,25: на глубине 135 м зона в два стандартных отклонения поднимает показатель до 0,61 — глинистая руда глубоко в карьере, как в сценарии «Глинистая руда в забое»."}
  west_bias: {<<: *libekb, value: 0.15, unit: "-", status: assumption, title: "Прибавка каолинизации на западном торце карьера",
    note: "С. 4: в западной части месторождения — более 30 млн т каолинизированного сырья (статья не датирована, около 2012–2015 годов). Прибавка растёт линейно от 0 в середине карьера до 0,15 на западном торце; величина — допущение."}
  clay_grade_factor: {<<: *kz20, value: 1.2, unit: "-", status: derived, title: "Во сколько раз глинистая руда богаче сульфидной",
    note: "С. 5: в IV квартале 2020 года содержание меди в глинистой руде 0,61 %, в сульфидной 0,51 %: 0,61 / 0,51 = 1,2. Обогащение коры выветривания вторичными минералами меди; модель умножает содержание рудного блока, ставшего глинистой рудой, на 1,2."}
  share_2024: {<<: *kz24, value: 17.1, unit: "%", status: derived, title: "Доля глинистой руды в добытой руде, 2024 год (для сравнения)",
    note: "Добыто 35 504 тыс. т руды, из них глинистой 6086 тыс. т: 6086 / 35 504 = 17,1 % (2025 год — 17,6 %, KAZ, отчёт за 2025 год, с. 4). В модели — один забой из четырёх рудных на глинистой руде: 755 т/ч из 4743 т/ч добытой руды с забалансовой (15,9 %), 17,5 % руды, идущей на фабрики."}

truck:
  payload_t: {<<: *cat785, value: 136, unit: t, status: sourced, title: "Номинальная грузоподъёмность",
    note: "Rated / nominal payload 300 000 фунтов (136,1 т). В обзоре KAZ 2014 года (с. 11) — до 140 т."}
  empty_mass_t: {<<: *cat785, value: 102.1, unit: t, status: sourced, title: "Масса без груза",
    note: "Empty weight с плоским кузовом 225 200 фунтов (102,1 т). Полная масса 102,1 + 136 = 238,1 т при наибольшей допустимой 249,5 т."}
  engine_kw: {<<: *cat785, value: 1005, unit: kW, status: sourced, title: "Мощность двигателя (нетто)",
    note: "Cat 3512B-EUI: 1348 л. с. (1005 кВт) нетто по SAE J1349 / ISO 9249, брутто 1081 кВт."}
  max_speed_kmh: {<<: *cat785, value: 54.7, unit: km/h, status: sourced, title: "Наибольшая скорость с грузом", note: "Шестая передача, 34 мили/ч."}
  bsfc_g_kwh: {<<: *assumed, value: 210, unit: g/kWh, status: assumption, title: "Удельный расход топлива двигателя",
    note: "Для Cat 3512B в найденных источниках не указан; обычный уровень для крупных быстроходных дизелей этого класса. Расход в час = использованная мощность × 210 г/кВт·ч ÷ плотность топлива; на полной мощности 1005 × 0,210 / 0,8318 = 253,7 л/ч."}
  diesel_density_kg_l: {<<: *turija, value: 0.8318, unit: kg/l, status: sourced, title: "Плотность дизельного топлива",
    note: "Раздел 2, значение, которым рудник Турия пересчитывает массу топлива в объём."}
  idle_load_factor: {<<: *assumed, value: 0.10, unit: "-", status: assumption, title: "Загрузка двигателя на холостом ходу",
    note: "Источник не найден. 10 % мощности на вспомогательные агрегаты: 253,7 × 0,10 = 25,4 л/ч при стоянке с работающим двигателем."}
  cycle_load_factor_min: {<<: *turija, value: 0.35, unit: "-", status: sourced, title: "Средняя загрузка двигателя за рейс, нижняя граница",
    note: "Раздел 2: 0,35 для средних условий. Соответствует 253,7 × 0,35 = 89 л/ч. Модель не задаёт этот коэффициент, а проверяется по нему."}
  cycle_load_factor_max: {<<: *turija, value: 0.50, unit: "-", status: sourced, title: "Средняя загрузка двигателя за рейс, верхняя граница",
    note: "Разделы 2–3: 0,50 для тяжёлых условий, 0,45–0,50 измерено на самосвалах рудника Турия. Соответствует 127 л/ч."}
  drivetrain_efficiency: {<<: *assumed, value: 0.80, unit: "-", status: assumption, title: "Доля мощности двигателя на колёсах",
    note: "Кривые тяги 785C не найдены. Потери механической трансмиссии с гидротрансформатором и привод вспомогательных агрегатов. На подъёме 10 % с грузом даёт 9,7 км/ч, на 8 % — 11,6 км/ч (вторая и третья передачи 785C — 16,4 и 22,2 км/ч наибольшей скорости)."}
  accel_max_ms2: {<<: *assumed, value: 0.5, unit: m/s2, status: assumption, title: "Наибольшее ускорение", note: "Ограничение по плавности разгона; на подъёме разгон ограничен мощностью."}
  brake_ms2: {<<: *assumed, value: 1.0, unit: m/s2, status: assumption, title: "Рабочее замедление", note: "Спокойное служебное торможение."}
  downhill_threshold_pct: {<<: *assumed, value: 4.0, unit: "%", status: assumption, title: "Уклон, с которого спуск идёт на замедлителе", note: "На более крутом спуске скорость ограничена замедлителем."}
  downhill_loaded_kmh: {<<: *assumed, value: 20, unit: km/h, status: assumption, title: "Скорость гружёного самосвала на спуске",
    note: "Кривые замедлителя не найдены. Спуск с грузом в модели редок (объезды при закрытых участках)."}
  downhill_empty_kmh: {<<: *assumed, value: 30, unit: km/h, status: assumption, title: "Скорость порожнего самосвала на спуске", note: "Равна ограничению скорости на съездах."}
  pace_min: {<<: *assumed, value: 0.92, unit: "-", status: assumption, title: "Разброс манеры вождения",
    note: "Каждый участок самосвал проходит со скоростью от 92 до 100 % допустимой."}
  overload_limit: {<<: *cat785, value: 1.08, unit: "-", status: derived, title: "Допустимая перегрузка",
    note: "Наибольшая полная масса 249,5 т − масса без груза 102,1 т = 147,4 т = 1,08 × 136 т. Погрузка прекращается, когда следующий ковш увёл бы груз дальше от номинала."}
  tank_l: {<<: *cat785, value: 1892, unit: l, status: sourced, title: "Объём топливного бака", note: "Fuel tank 500 галлонов (1892,5 л)."}
  refuel_below_pct: {<<: *assumed, value: 15, unit: "%", status: assumption, title: "Остаток топлива, при котором самосвал едет на заправку", note: "Около двух часов работы в запасе."}
  local_speed_kmh: {<<: *assumed, value: 15, unit: km/h, status: assumption, title: "Скорость по рабочей площадке, от узла дороги до экскаватора", note: "Движение по рабочей площадке уступа."}
  queue_spacing_m: {<<: *assumed, value: 25, unit: m, status: assumption, title: "Шаг машин в очереди", note: "Длина самосвала (11,1 м) с промежутком."}
  changeover_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "Длительность пересменки экипажа",
    note: "После первой разгрузки в новой смене самосвал стоит на передаче смены и ежесменном осмотре. Источник не найден; на карьерах с 12-часовыми сменами передача с осмотром обычно занимает 20–45 минут."}
  meal_break_min: {<<: *assumed, value: 40, unit: min, status: assumption, title: "Перерыв экипажа на приём пищи за смену",
    note: "Источник не найден. Вместе с пересменкой и заправкой самосвал в смену работает около 10,5 из 12 часов: так время работы исправного самосвала приближается к коэффициенту использования 0,80, по которому рассчитан парк (`plan.use_of_availability`)."}
  break_from_h: {<<: *assumed, value: 4, unit: h, status: assumption, title: "Начало окна перерывов экипажей от начала смены",
    note: "Перерывы разнесены по времени, чтобы экскаваторы не простаивали: у каждого самосвала свой момент между 4 и 8 часами смены."}
  break_to_h: {<<: *assumed, value: 8, unit: h, status: assumption, title: "Конец окна перерывов экипажей от начала смены", note: "См. предыдущую строку."}
  engine_temp_thermostat_c: {<<: *assumed, value: 85, unit: "°C", status: assumption, title: "Температура охлаждающей жидкости без нагрузки",
    note: "Пороговые значения двигателя не найдены; взят обычный уровень термостата дизеля."}
  engine_temp_full_load_c: {<<: *assumed, value: 96, unit: "°C", status: assumption, title: "Температура охлаждающей жидкости на полной мощности",
    note: "При опорной температуре воздуха; между холостым ходом и полной мощностью температура растёт вместе с загрузкой двигателя."}
  engine_temp_ambient_ref_c: {<<: *assumed, value: 20, unit: "°C", status: assumption, title: "Опорная температура воздуха для температуры двигателя", note: "Точка, к которой отнесены два значения выше."}
  engine_temp_ambient_gain: {<<: *assumed, value: 0.15, unit: "°C/°C", status: assumption, title: "Влияние температуры воздуха на температуру двигателя", note: "Система охлаждения гасит большую часть колебаний воздуха."}
  engine_temp_lag_min: {<<: *assumed, value: 5, unit: min, status: assumption, title: "Постоянная времени температуры двигателя", note: "Тепловая инерция системы охлаждения."}
  engine_cooldown_lag_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Постоянная времени остывания заглушенного двигателя", note: "В ремонте и на заправке двигатель остывает к температуре воздуха."}
  tyres: {<<: *cat785, value: 6, unit: "-", status: sourced, title: "Число шин", note: "Шины 33.00-R51: две передние и четыре задние (сдвоенные)."}
  tyre_tkph_ref_ambient_c: {<<: *michelin, value: 38, unit: "°C", status: sourced, title: "Температура воздуха, к которой отнесён показатель TKPH шины",
    note: "Определение TKPH и поправка K2 (с. 171): TKPH = средняя нагрузка на шину, т × средняя скорость, км/ч."}
  tyre_tkph_rating: {<<: *assumed, value: 750, unit: t·km/h, status: assumption, title: "Показатель TKPH шины",
    note: "Каталожное значение для шин 33.00-R51 модели не найдено. Рабочая точка модели: средняя нагрузка (238,1 + 102,1) / 2 / 6 = 28,4 т на шину × около 20 км/ч = 570; шина выбрана с запасом около 30 %."}
  tyre_temp_rise_at_rating_c: {<<: *assumed, value: 55, unit: "°C", status: assumption, title: "Нагрев шины над воздухом при работе на паспортном TKPH",
    note: "Предельная температура шины в справочнике не дана. Нагрев пропорционален произведению нагрузки на скорость, как в определении TKPH."}
  tyre_temp_limit_c: {<<: *derived, value: 93, unit: "°C", status: derived, title: "Расчётный предел температуры шины",
    note: "38 + 55 = 93 °C: температура, до которой шина нагревается на паспортном TKPH при опорной температуре воздуха."}
  tyre_temp_lag_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Постоянная времени температуры шины", note: "Крупногабаритная шина прогревается и остывает около часа."}

loader:
  bucket_m3: {<<: *hitachi, value: 21, unit: m3, status: sourced, title: "Вместимость ковша",
    note: "С. 17: прямая лопата с ковшом 21 м3 (SAE, с шапкой 2:1); в обзоре KAZ 2014 года (с. 10) — экскаваторы Hitachi 21 м3."}
  fill_factor: {<<: *derived, value: 0.90, unit: "-", status: derived, title: "Коэффициент наполнения ковша",
    note: "136 т за 4 ковша = 34 т на ковш; 34 / (21 м3 × 1,8 т/м3) = 0,90: верхняя граница полосы «средние условия» 75–90 % статьи Caterpillar о наполнении ковша, ковш рассчитан на плотность до 1,8 т/м3."}
  fill_factor_sd: {<<: *assumed, value: 0.04, unit: "-", status: assumption, title: "Разброс наполнения от ковша к ковшу", note: "Даёт груз самосвала около 136 ± 6 т."}
  fill_factor_min: {<<: *assumed, value: 0.65, unit: "-", status: assumption, title: "Наименьшее наполнение ковша", note: "Нижняя граница для крупнокусковой взорванной массы."}
  fill_factor_max: {<<: *assumed, value: 1.0, unit: "-", status: assumption, title: "Наибольшее наполнение ковша", note: "Ковш с шапкой на хорошо взорванной породе."}
  fill_frag_slope: {<<: *assumed, value: 0.25, unit: "-", status: assumption, title: "Падение наполнения ковша с ростом крупности",
    note: "Наполнение = 0,90 × (1 − 0,25 × (P80 − P80оп) / P80оп). Направление связи описано в ISEE 2005 «Characteristics of the blasted muck and the loader's productivity»; численного значения в источниках нет."}
  pass_s: {<<: *assumed, value: 30, unit: s, status: assumption, title: "Длительность одного цикла черпания",
    note: "Не опубликована. По паспорту поворот 3,2 об/мин: поворот на 90° к самосвалу и обратно около 9 с, черпание и разгрузка ковша около 20 с; 4 ковша = 2 минуты на самосвал."}
  pass_spread: {<<: *assumed, value: 0.15, unit: "-", status: assumption, title: "Разброс длительности цикла черпания", note: "Равномерно ± 15 %."}
  spot_s: {<<: *assumed, value: 45, unit: s, status: assumption, title: "Время установки самосвала под погрузку", note: "Источник не найден."}
  power_rated_kw: {<<: *hitachi, value: 1200, unit: kW, status: sourced, title: "Мощность электропривода экскаватора",
    note: "С. 14: EX3600E-6, асинхронный двигатель 6 кВ, номинальная длительная мощность 1200 кВт."}
  load_factor_digging: {<<: *assumed, value: 0.75, unit: "-", status: assumption, title: "Загрузка привода при черпании", note: "Источник не найден."}
  load_factor_idle: {<<: *assumed, value: 0.08, unit: "-", status: assumption, title: "Загрузка привода в ожидании", note: "Насосы и вспомогательные системы."}
  load_factor_travel: {<<: *assumed, value: 0.40, unit: "-", status: assumption, title: "Загрузка привода при переезде", note: "Источник не найден."}
  travel_kmh: {<<: *hitachi, value: 2.2, unit: km/h, status: sourced, title: "Скорость передвижения экскаватора", note: "С. 17: наибольшая скорость хода 2,2 км/ч."}
  relocate_setup_min: {<<: *assumed, value: 15, unit: min, status: assumption, title: "Подготовка забоя после переезда", note: "Перенос кабеля и планировка площадки."}
  face_offset_m: {<<: *assumed, value: 15, unit: m, status: assumption, title: "Расстояние от экскаватора до кромки блока", note: "Экскаватор стоит на рабочей площадке перед блоком; около радиуса черпания."}
  fallback_wait_min: {<<: *assumed, value: 10, unit: min, status: assumption, title: "Простой экскаватора, после которого его самосвалы уходят к другому",
    note: "Правило мастера смены: если экскаватор неисправен, выведен из зоны взрыва или переезжает дольше этого времени, его самосвалы временно грузятся у других."}
  ore_faces: {<<: *derived, value: 4, unit: "-", status: derived, title: "Экскаваторов на руде по плану",
    note: "6 экскаваторов × доля руды (с забалансовой) в горной массе 0,647 = 3,9 ≈ 4: три на сульфидной руде, один на глинистой; два работают на вскрыше."}

drill:
  bench_height_m: {<<: *dyno, value: 15, unit: m, status: derived, title: "Высота уступа",
    note: "С. 4: высота уступа, м ≥ диаметр скважины, мм / 15. Для скважин 216 мм: 216 / 15 = 14,4 м ≤ 15 м."}
  hole_diameter_mm: {<<: *assumed, value: 216, unit: mm, status: assumption, title: "Диаметр взрывных скважин",
    note: "Долото 8½ дюйма, внутри диапазона станка Sandvik D55SP (172–254 мм, бурение за один проход до 17 м — больше глубины скважины 16,7 м): наибольший распространённый диаметр, совместимый с уступом 15 м по правилу Dyno Nobel."}
  burden_m: {<<: *dyno, value: 6.0, unit: m, status: derived, title: "Линия наименьшего сопротивления",
    note: "С. 4: (25–40) × диаметр = 5,4–8,6 м; взято 6,0 м (27,8 диаметра). Отношение высоты уступа к ЛНС 15 / 6 = 2,5, в полосе хорошего дробления 2–3,5."}
  spacing_m: {<<: *dyno, value: 7.0, unit: m, status: derived, title: "Расстояние между скважинами в ряду", note: "С. 4: 1,15 × ЛНС = 6,9 м, округлено до 7,0 м."}
  subdrill_m: {<<: *dyno, value: 1.7, unit: m, status: derived, title: "Перебур", note: "С. 4: (3–15) × диаметр; взято 8 × 0,216 = 1,7 м."}
  hole_depth_m: {<<: *derived, value: 16.7, unit: m, status: derived, title: "Глубина скважины", note: "Высота уступа 15 м + перебур 1,7 м."}
  gross_rate_m_h: {<<: *pitviper, value: 30.4, unit: m/h, status: snippet, title: "Сменная производительность бурового станка",
    note: "Для D55SP не найдена. Станок того же класса (Atlas Copco Pit Viper) — 365 м за 12-часовую смену на медном карьере, уступы 15 м: 365 / 12 = 30,4 м/ч, включая переезды между скважинами."}
  move_min_per_hole: {<<: *assumed, value: 8, unit: min, status: assumption, title: "Переезд и установка на скважину", note: "Источник не найден."}
  penetration_m_h: {<<: *derived, value: 40, unit: m/h, status: derived, title: "Чистая скорость бурения при средней крепости",
    note: "Скважина 16,7 м: 16,7 / 40 × 60 = 25 мин бурения + 8 мин переезда = 33 мин; 16,7 / 33 × 60 = 30,4 м/ч, что совпадает со сменной производительностью. В более крепкой породе скорость ниже обратно пропорционально индексу Бонда."}
  tram_kmh: {<<: *assumed, value: 1.5, unit: km/h, status: assumption, title: "Скорость перегона станка между блоками", note: "Источник не найден."}
  drill_ahead_blocks: {<<: *assumed, value: 19, unit: "-", status: assumption, title: "Запас подготовленных блоков, при котором бурение приостанавливается",
    note: "Станок не начинает новый блок, пока перед экскаваторами столько блоков взорвано, заряжено, обурено или бурится. На старте модели их 18 (7 взорванных, 3 заряженных, 4 обуренных и 4 в бурении, `world.yaml`), так что станки бурят с первого часа и дальше начинают новый блок, как только экскаватор переходит на очередной взорванный блок: бурение идёт в темпе выемки. Четыре станка без остановок дают 20,4 км бурения в неделю, выемка рудника требует около 12 км (около 1,2 млн т горной массы в неделю: скважина 16,7 м на 6 × 7 × 15 м × 2,56 т/м3 = 1613 т); тест `test_modules` проверяет, что за неделю пробурено не меньше, чем нужно на вынутую горную массу."}

blast:
  powder_factor_min_kg_m3: {<<: *dyno, value: 0.7, unit: kg/m3, status: sourced, title: "Удельный расход ВВ, нижняя граница", note: "С. 4: массовые взрывы в крепких породах, 0,7–0,8 кг/м3."}
  powder_factor_max_kg_m3: {<<: *dyno, value: 0.8, unit: kg/m3, status: sourced, title: "Удельный расход ВВ, верхняя граница", note: "Там же. Каждый взрыв получает значение из этого диапазона."}
  charge_per_hole_kg: {<<: *derived, value: 472.5, unit: kg, status: derived, title: "Заряд одной скважины",
    note: "0,75 кг/м3 × 6,0 м × 7,0 м × 15 м = 472,5 кг. Колонка заряда 12,2 м в скважине 216 мм при плотности 1,15 т/м3 вмещает около 514 кг."}
  exclusion_radius_m: {<<: *order605, value: 200, unit: m, status: sourced, title: "Радиус опасной зоны для людей",
    note: "Приложение 20, п. 1.5: скважинные заряды, не менее 200 м. Использован российский документ: текст казахстанских правил (приказ № 343 от 30.12.2014) получить не удалось."}
  reentry_min: {<<: *order605, value: 15, unit: min, status: sourced, title: "Время до допуска в зону после взрыва", note: "П. 441: осмотр взорванных блоков не ранее чем через 15 минут после массового взрыва."}
  equipment_withdrawal_m: {<<: *assumed, value: 150, unit: m, status: assumption, title: "Расстояние отвода техники от взрываемого блока",
    note: "Норматив для техники не найден: безопасное расстояние для машин задаёт проект взрыва. Экскаваторы и станки ближе этого расстояния отводятся и останавливаются."}
  clearance_lead_min: {<<: *assumed, value: 20, unit: min, status: assumption, title: "Оцепление зоны до взрыва", note: "За это время машины покидают зону, въезд в неё закрыт."}
  charging_holes_per_h: {<<: *assumed, value: 20, unit: 1/h, status: assumption, title: "Скорость заряжания скважин", note: "Три минуты на скважину смесительно-зарядной машиной; блок 115 × 50 м из 137 скважин заряжается около 7 часов."}
  extra_window_below_h: {<<: *assumed, value: 24, unit: h, status: assumption, title: "Запас взорванной горной массы, ниже которого используется второе окно взрыва",
    note: "Правило рудника: массовые взрывы только в светлое время суток и не больше одного в сутки (окно 13:00, `world.yaml`, `clock.blast_times`). Второе дневное окно (16:30, `clock.extra_blast_times`) используется, только если взорванной горной массы в забоях меньше, чем на 24 часа выемки при требуемой выемке рудника 7330 т/ч (`plan.rock_tph`, около 176 тыс. т), то есть темп выемки требует второго взрыва. Блок около 220 тыс. т — это около 30 часов выемки всего участка."}
  p80_ref_mm: {<<: *assumed, value: 350, unit: mm, status: assumption, title: "Крупность взорванной массы P80 в опорных условиях",
    note: "При удельном расходе 0,75 кг/м3 и индексе Бонда 14 кВт·ч/т. Источник не найден; значение задаёт уровень, от которого считаются отклонения."}
  p80_powder_exponent: {<<: *kuzram, value: -0.8, unit: "-", status: snippet, title: "Показатель степени при удельном расходе ВВ",
    note: "Формула Кузнецова в модели Куз-Рам: средний кусок пропорционален удельному расходу в степени −0,8. P80 = 350 × (ВВ / 0,75)^−0,8 × (индекс Бонда / 14)^1,0."}
  p80_hardness_exponent: {<<: *assumed, value: 1.0, unit: "-", status: assumption, title: "Показатель степени при крепости породы", note: "Коэффициент породы в формуле Кузнецова принят пропорциональным индексу Бонда."}
  p80_min_mm: {<<: *assumed, value: 200, unit: mm, status: assumption, title: "Наименьшая крупность P80", note: "Ограничение формулы."}
  p80_max_mm: {<<: *assumed, value: 600, unit: mm, status: assumption, title: "Наибольшая крупность P80", note: "Ограничение формулы."}

road:
  speed_limit_surface_kmh: {<<: *assumed, value: 40, unit: km/h, status: assumption, title: "Ограничение скорости на технологических дорогах", note: "Общего норматива не найдено; встречается в правилах отдельных рудников."}
  speed_limit_ramp_kmh: {<<: *assumed, value: 30, unit: km/h, status: assumption, title: "Ограничение скорости на съездах", note: "Источник не найден."}
  speed_limit_bench_kmh: {<<: *assumed, value: 25, unit: km/h, status: assumption, title: "Ограничение скорости на дорогах уступов", note: "Источник не найден."}
  rr_surface_pct: {<<: *rpm, value: 2.0, unit: "%", status: sourced, title: "Сопротивление качению на технологической дороге", note: "Таблица сопротивлений качению: Main Haul Road."}
  rr_ramp_pct: {<<: *rpm, value: 2.5, unit: "%", status: sourced, title: "Сопротивление качению на съезде", note: "Та же таблица: Pit Ramp."}
  rr_bench_pct: {<<: *rpm, value: 2.5, unit: "%", status: sourced, title: "Сопротивление качению на уступе", note: "Та же таблица: Bench Floor."}
  ramp_grade_max_pct: {<<: *rpm, value: 10, unit: "%", status: sourced, title: "Наибольший уклон съезда",
    note: "Раздел Grade: обычные уклоны съездов 6–12 %. Главный съезд модели построен с уклоном 8 %, западный — 10 % (`world.yaml`, `ramps`)."}
  wet_rr_added_pct: {<<: *assumed, value: 1.0, unit: "%", status: assumption, title: "Прибавка сопротивления качению на мокрой дороге",
    note: "Оценка: измеренных значений для карьерных дорог не найдено."}
  wet_speed_factor_ramp: {<<: *thompson, value: 0.90, unit: "-", status: snippet, title: "Снижение ограничения скорости на мокром съезде",
    note: "Оценка по правилу Томпсона: +1 % сопротивления качению снижает скорость на съезде на 10 %."}
  wet_speed_factor_flat: {<<: *thompson, value: 0.74, unit: "-", status: snippet, title: "Снижение ограничения скорости на мокрой горизонтальной дороге",
    note: "Оценка по правилу Томпсона: +1 % сопротивления качению снижает скорость на горизонтальной дороге на 26 %."}
  wet_closed_grade_pct: {<<: *assumed, value: 9.5, unit: "%", status: assumption, title: "Средний уклон съезда, при котором его закрывают в сильный дождь",
    note: "Правило рудника: на мокром покрытии гружёный самосвал не удерживается на самом крутом съезде. По геометрии модели под правило попадает западный съезд (10 %); главный съезд (8 %) остаётся открытым. Участок, закрытие которого отрезало бы забои от дорог, не закрывают (по нему едут с мокрым ограничением скорости): из трёх участков западного съезда закрывается верхний, от горизонта 200 м до выезда, и самосвалы забоев западного торца выезжают через дно карьера и главный съезд."}
  drying_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "Время просыхания дорог после осадков",
    note: "После осадков ограничения скорости и закрытие крутого съезда действуют ещё это время. Источник не найден; в сухой ветреной степи у Экибастуза дороги сохнут быстро."}
  width_m: {<<: *assumed, value: 25, unit: m, status: assumption, title: "Ширина проезжей части", note: "Двухполосная дорога, около 3,5 ширины самосвала."}
  closure_expected_h: {<<: *assumed, value: 6, unit: h, status: assumption, title: "Ожидаемая длительность закрытия участка дороги (сценарий)",
    note: "Причина в сценарии «Закрытие дороги»: осыпь с откоса уступа на проезжую часть или размыв обочины. Дорожная бригада рудника (бульдозер и погрузчик) убирает горную массу, восстанавливает предохранительный вал и проверяет откос. Опубликованных длительностей не найдено; 6 ч — допущение: половина смены."}

plan:
  plant_availability: {<<: *assumed, value: 0.92, unit: "-", status: assumption, title: "Доля времени года, когда фабрики работают",
    note: "Не опубликована. Обычно 91–94 % для фабрик с МПСИ: плановые остановки на замену футеровки и ремонты (на ОФ-1 Бозшаколя — футеровка МПСИ в III квартале 2025 года, плановый ремонт в декабре 2024 года, отчёты KAZ). В модели фабрики не останавливаются на плановые ремонты, поэтому производительность за год = часовая × 8760 ч × 0,92."}
  mill_rate_tph: {<<: *kz24, value: 3557, unit: t/h, status: derived, title: "Производительность ОФ-1 во время работы",
    note: "Переработано руды 34 755 тыс. т (2024 год); раздельно по фабрикам KAZ Minerals переработку не публикует. Если ОФ-2 переработала столько, сколько добыто глинистой руды (6086 тыс. т), на ОФ-1 пришлось 28 669 тыс. т: 28 669 000 / (8760 ч × 0,92) = 3557 т/ч. Для сравнения: разрешение 2020 года — 28 млн т в год (3196 т/ч календарных), проект МПСИ 3425 т/ч, испытания 2024 года — до 3902 т/ч (ecoportal 68959, с. 1–3)."}
  clay_rate_tph: {<<: *kz24, value: 755, unit: t/h, status: derived, title: "Производительность ОФ-2 во время работы",
    note: "Добыто глинистой руды 6086 тыс. т (2024 год), принято равным её переработке: 6 086 000 / (8760 ч × 0,92) = 755 т/ч. Разрешение — 7 млн т в год (799 т/ч), проект 2014 года — 5 млн т в год; KAZ Minerals сообщает, что ОФ-2 работает выше проектной мощности."}
  ore_share: {<<: *derived, value: 0.647, unit: "-", status: derived, title: "Доля руды (с забалансовой) в горной массе", note: "1 / (1 + 0,545) = 0,647: (3557 + 755 + 431) / 7330."}
  rock_tph: {<<: *derived, value: 7330, unit: t/h, status: derived, title: "Горная масса, которую должен вынимать парк рудника",
    note: "Руда для фабрик (3557 + 755) т/ч × (1 + 0,7) = 4312 × 1,7 = 7330 т/ч: сульфидная руда 3557, глинистая 755, забалансовая 431, вскрыша 2587 т/ч. За год (8760 ч × 0,92) это 59,1 млн т горной массы; текущий план горных работ на 2024 год — 60,4 млн т (ecoportal 29174, с. 2)."}
  fleet_reserve: {<<: *assumed, value: 0.10, unit: "-", status: assumption, title: "Запас провозной способности парка над потребностью",
    note: "Парк рассчитан на 10 % больше, чем берут фабрики: склады восстанавливаются после остановок экскаваторов и дробилки, очереди не съедают план."}
  availability: {<<: *hvi_uptime, value: 0.85, unit: "-", status: snippet, title: "Коэффициент технической готовности самосвалов",
    note: "Среднее по отрасли 72–82 %, лучшие рудники 92–94 %; для расчёта парка взято 85 %."}
  use_of_availability: {<<: *hvi_metrics, value: 0.80, unit: "-", status: snippet, title: "Коэффициент использования исправного парка",
    note: "Диапазон 70–85 %: очереди, заправка, пересменка, остановки на время взрывов."}
  cycle_min: {<<: *derived, value: 20.9, unit: min, status: derived, title: "Расчётный рейс самосвала без очередей, среднее по парку",
    note: "Считает mine/sim/design_basis.py по модели на исходных забоях: путь с грузом и обратно по кратчайшим маршрутам с модельными скоростями, проезд по рабочей площадке, установка 45 с, 4 ковша по 30 с, установка и разгрузка; среднее по самосвалам, взвешенное по их расстановке. Забои: дно карьера +5 м — откатка руды на дробилку 3,5 км, рейс 27,9 мин; уступ 95 м (на старте — забалансовая руда на склад) — 3,0 км, 21,4 мин; уступ 140 м — 1,7 км, 14,6 мин; глинистая руда с уступа 200 м на ОФ-2 — 3,5 км, 16,8 мин; вскрыша с уступа 215 м — 3,2 км, 15,2 мин, с уступа 155 м — 4,1 км, 21,3 мин. Тест сверяет значение с моделью."}
  trucks: {<<: *derived, value: 31, unit: "-", status: derived, title: "Число самосвалов рудника",
    note: "Сумма по забоям: самосвалов на забой = темп забоя × 1,10 × рейс забоя / 60 / (136 т × 0,85 × 0,80), округление вверх. Сульфидная и забалансовая руда делятся поровну между тремя рудными забоями (по 1329 т/ч), глинистая руда — 755 т/ч на один забой, вскрыша 2587 т/ч — на два забоя: 8 + 6 + 4 + 3 + 4 + 6 = 31 самосвал (world.yaml, `fleet.allocation`). Самосвал делает около 17 100 рейсов в год; в проекте 2014–2015 годов — 18 самосвалов Caterpillar 785C по 18 000 рейсов в год на первые годы, когда карьер был неглубоким, а горная масса меньше."}
  shovel_rate_mtpa: {<<: *kz2014, value: 11, unit: Mt/yr, status: sourced, title: "Годовая выработка экскаватора по проекту",
    note: "С. 10: каждый из четырёх экскаваторов Hitachi 21 м3 вынимает 11 млн т горной массы в год."}
  shovels: {<<: *derived, value: 6, unit: "-", status: derived, title: "Число экскаваторов рудника",
    note: "59,1 млн т горной массы в год / 11 млн т = 5,4, округлено вверх до 6: три забоя сульфидной руды (по 1329 т/ч сульфидной и забалансовой руды), один забой глинистой руды (755 т/ч) и два забоя вскрыши (по 1294 т/ч). В проекте 2014–2015 годов — четыре экскаватора Hitachi 21 м3 и один Hitachi 870 (обзор 2014 года, с. 10; презентация 2015 года, с. 29)."}
  drill_utilization: {<<: *assumed, value: 0.70, unit: "-", status: assumption, title: "Доля календарного времени, когда станок бурит",
    note: "Переезды между блоками, обслуживание, простои у взрывов; источник не найден."}
  drills: {<<: *derived, value: 4, unit: "-", status: derived, title: "Число буровых станков рудника",
    note: "59,1 млн т / 2,56 т/м3 = 23,1 млн м3 в год; на скважину 6 × 7 × 15 = 630 м3 и 16,7 м бурения: 36 600 скважин, 611 км в год. Станок даёт 30,4 м/ч × 8760 ч × 0,70 = 186 км в год: 611 / 186 = 3,3, округлено вверх до 4 — столько же станков Sandvik D55 в проекте 2014 года."}
  trucks_2014: {<<: *kz2014, value: 18, unit: "-", status: sourced, title: "Самосвалов в проекте Бозшаколя 2014 года (для сравнения)",
    note: "С. 11: 18 самосвалов Caterpillar 785C, каждый в среднем 18 000 рейсов в год за первые десять лет."}
  journeys_2014: {<<: *kz2014, value: 18000, unit: 1/yr, status: sourced, title: "Рейсов самосвала в год в проекте 2014 года (для сравнения)",
    note: "С. 11. 18 000 × 140 т = 2,52 млн т в год на самосвал; при готовности и использовании 0,68 это рейс около 20 минут — неглубокий карьер первых лет."}

crusher:
  design_tph: {<<: *kz2014, value: 4186, unit: t/h, status: sourced, title: "Проектная производительность дробилки",
    note: "С. 12: гирационная дробилка FLSmidth 60 × 113 дюймов, 4186 т/ч, 750 кВт."}
  rated_tph: {<<: *derived, value: 4347, unit: t/h, status: derived, title: "Производительность дробилки в модели",
    note: "Проектные 4186 т/ч × (3557 / 3425): ОФ-1 работает на 4 % выше проекта МПСИ 2014 года, дробилка принята пропорционально (её щель перенастраивается; гирационные дробилки класса 60 × 113 дают 3810–8200 т/ч, NFLG). На испытаниях 2024 года линия дошла до 3902 т/ч — 93 % проектной производительности дробилки."}
  motor_kw: {<<: *kz2014, value: 750, unit: kW, status: sourced, title: "Мощность привода дробилки", note: "С. 12."}
  idle_load_factor: {<<: *assumed, value: 0.15, unit: "-", status: assumption, title: "Загрузка привода дробилки вхолостую", note: "Источник не найден."}
  hopper_t: {<<: *assumed, value: 450, unit: t, status: assumption, title: "Вместимость приёмного бункера",
    note: "Около 3,3 груза самосвала 136 т: самосвал разгружается, только если груз помещается в бункер. Источник не найден."}
  spot_s: {<<: *assumed, value: 30, unit: s, status: assumption, title: "Время установки самосвала на разгрузку у дробилки", note: "Источник не найден."}
  dump_s: {<<: *assumed, value: 45, unit: s, status: assumption, title: "Время разгрузки кузова",
    note: "Подъём кузова 785C — 15,2 с, опускание 15,9 с (таблица характеристик 785C); с выходом груза около 45 с."}
  dump_spread: {<<: *assumed, value: 0.15, unit: "-", status: assumption, title: "Разброс времени разгрузки", note: "Равномерно ± 15 %."}
  product_p80_mm: {<<: *nflg, value: 150, unit: mm, status: snippet, title: "Крупность дроблёной руды", note: "Разгрузочная щель дробилок этого класса 152–254 мм; принята работа на щели 152 мм."}
  size_slope: {<<: *assumed, value: 0.3, unit: "-", status: assumption, title: "Падение производительности дробилки с ростом крупности питания",
    note: "Производительность = номинальная × (1 − 0,3 × (P80 − P80оп) / P80оп), не выше номинальной. Численной зависимости в источниках нет."}
  size_factor_min: {<<: *assumed, value: 0.6, unit: "-", status: assumption, title: "Нижняя граница поправки на крупность", note: "Ограничение формулы."}
  divert_queue_len: {<<: *assumed, value: 3, unit: "-", status: assumption, title: "Очередь у дробилки, при которой руду везут на склад",
    note: "Правило смены: если у дробилки уже ждут столько самосвалов, следующий разгружается на складе богатой руды."}
  divert_note_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "Пауза между записями в журнале о разгрузке на склад",
    note: "Настройка журнала: записывается начало периода, когда руда идёт на склад, а не каждый самосвал."}
  stop_wait_min: {<<: *assumed, value: 10, unit: min, status: assumption, title: "Ожидание у остановленной дробилки до ухода на рудный склад",
    note: "Правило смены: первые самосвалы ждут пуска дробилки; если остановка длится дольше, очередь уходит на склад богатой руды, а следующие гружёные самосвалы едут туда сразу."}
  repair_mechanical_h: {<<: *assumed, value: 8, unit: h, status: assumption, title: "Ожидаемая длительность ремонта дробилки при механической неисправности (сценарий)",
    note: "Причина по умолчанию в сценарии «Остановка дробилки»: неисправность гидросистемы регулировки конуса, системы смазки или привода, которую устраняют заменой узла из склада запчастей одной сменой ремонтников. Опубликованных длительностей таких ремонтов не найдено; 8 ч — допущение: меньше смены, больше заклинивания. Для сравнения: плановая замена брони конуса (мантии) крупной конусной дробилки — около 60 ч (Metso, кейс рудника La Caridad, дробилки Superior 60-89), это плановый ремонт, а не решение начальника смены."}
  repair_jam_h: {<<: *assumed, value: 3, unit: h, status: assumption, title: "Ожидаемая длительность остановки дробилки при заклинивании (сценарий)",
    note: "Забутовка камеры негабаритом или куском металла: глыбу дробят гидромолотом над камерой или вынимают краном, затем осматривают броню. Поставщики называют заклинивания главной причиной внеплановых остановок первичных дробилок, длительность не публикуют; 3 ч — допущение."}

dump:
