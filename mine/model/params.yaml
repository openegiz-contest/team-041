    source: "UK DESNZ, Greenhouse gas reporting: conversion factors 2026, полный набор, лист Fuels, Diesel (average biofuel blend), litres, kg CO2e",
    url: "https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026",
    note: "Дизель со средней долей биотоплива; для чистого минерального дизеля 2,66155 кг CO₂e/л. Прямые выбросы при сжигании, без добычи и доставки топлива."}
  grid_co2_t_mwh: {value: 0.603, unit: t CO2/MWh, status: sourced, title: "Выбросы CO₂ на 1 МВт·ч электроэнергии сети Казахстана",
    source: "Low-Carbon Power, страница Казахстана: углеродоёмкость электроэнергии за 12 месяцев с апреля 2025 по март 2026 года (по данным Ember, Energy Institute, IEA)",
