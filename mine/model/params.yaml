  stock_kzt_t: {value: 897, unit: KZT/t, status: snippet, title: "Работа парка на тонну горной массы в оценке запасов",
    source: "Crux Investor, Analysts' notes, неделя 11: стоимость выемки на открытых рудниках — от 2 USD за тонну на очень крупных рудниках и около вдвое больше при производительности ниже 15 млн т в год",
    url: "https://www.cruxinvestor.com/posts/analysts-notes-week-11",
    note: "Прогноз оценивает руду, которую горизонт оставляет следующей смене, везде одинаково, где бы она ни лежала — во взорванном блоке, в кузове, в бункере дробилки, на конвейере, на складе дроблёной руды, на рудном складе, в мельнице: медь, которую руда даст (содержание × опорное извлечение 87,2 % × цена оплачиваемой меди), за вычетом того, что ещё нужно, чтобы превратить её в концентрат. Мельница — узкое место фабрики, поэтому главное из этого — время мельницы: за то время, что мельница перерабатывает эту тонну, она переработала бы тонну средней руды месторождения (`geology.mean_head_grade_pct`, 0,41 %). Руда стоит своей меди сверх меди средней руды; добытая руда — ещё и работы парка, которую она избавляет делать заново, по этой цене; руда на рудных складах — за вычетом перевалки, которая ей ещё нужна (`rom.rehandle_kzt_t`, 208 тг/т). Энергия измельчения и флотации на тонну у руды и у средней руды, которую она вытесняет, одна и та же и сокращается. Вскрыша, снятая за горизонт, — по той же цене работы парка. Перекладывание руды из кучи в кучу поэтому меняет итог только на то, что перекладывание стоит: дизель и энергию за горизонт и перевалку с рудного склада. Богатая руда, взятая со склада или из богатого забоя, даёт медь, но запасы теряют её столько же: выигрывает только то, что прибавляет время мельницы, извлечение или экономит затраты. Взята нижняя граница источника: 2 USD/t × 448,45 тг/USD = 897 тг/т."}

forecast:
  horizon_h: {<<: *assumed, value: 12, unit: h, status: assumption, title: "Горизонт прогноза по умолчанию",
    note: "Одна смена: смены на руднике по 12 часов (`world.yaml`, `clock`: дневная с 8 до 20 ч). Решение начальника смены по инциденту оценивается на всю смену, за которую он отвечает, и дольше, чем склад дроблёной руды (несколько часов питания мельницы) скрывает потерю подачи руды."}
  max_horizon_h: {<<: *assumed, value: 24, unit: h, status: assumption, title: "Наибольший горизонт прогноза", note: "Настройка проекта: сутки модели считаются за несколько секунд."}
  period_s: {<<: *assumed, value: 20, unit: s, status: assumption, title: "Шаг обмена ядер модулей с моделью в прогнозе",
    note: "На стенде модуль видит изменения двойников раз в такт симулятора: 20 секунд модели при ускорении ×20. Прогноз воспроизводит этот такт."}
  max_parallel: {<<: *assumed, value: 12, unit: "-", status: assumption, title: "Сколько ветвей прогноза считается одновременно",
    note: "Ветви советника и модулей: каждая — отдельный процесс на своём ядре процессора с пониженным приоритетом (`nice` 10), чтобы не отнимать время у живого симулятора и сервисов модулей; два ядра остаются им, поэтому процессов не больше, чем доступных контейнеру ядер минус два (число ядер берётся из маски допустимых процессоров, а не из числа ядер хозяина). Советник заказывает 4 ветви × 3 парных повтора = 12: при 14 ядрах и больше они считаются разом, на 8 ядрах — в две волны по 6. Две ветви прогноза страницы запускаются сразу, сверх этого числа и раньше остальных, чтобы оператор не ждал фоновых прогнозов."}
  timeout_s: {<<: *assumed, value: 120, unit: s, status: assumption, title: "Наибольшее время счёта одной ветви",
    note: "Ветвь, не досчитанная за это время, снимается, прогноз получает статус error. Измерено на стенде: прогноз на 12 часов (две ветви) готов через 9–16 с на 24 ядрах и через 12–15 с на 8 ядрах (при закреплении всех контейнеров за ядрами 0–7; до ограничения процессов по ядрам и понижения их приоритета — 25 с), разбор советника (4 варианта × 3 повтора) — через 14–30 с на 24 ядрах и через 26 с на 8 ядрах, где ветви считаются в две волны по 6. Ожидание результата не короче 60 с для прогноза и 75 с для разбора советника: страница ждёт 90 с, проверка стенда — 90 с и 120 с."}
  max_replicas: {<<: *assumed, value: 6, unit: "-", status: assumption, title: "Наибольшее число парных повторов одного прогноза",
    note: "Повтор считает обе ветви ещё раз на своих случайных потоках, одинаковых для ветвей A и B. Защита от ошибочного запроса: шесть повторов четырёх ветвей советника — 24 процесса."}
  max_actions: {<<: *assumed, value: 40, unit: "-", status: assumption, title: "Наибольшее число действий в ветви", note: "Защита от ошибочного запроса."}
  noise_kzt: {<<: *assumed, value: 8000000, unit: KZT, status: assumption, title: "Парный разброс одного прогноза по итогу с поправкой за 12 ч (стандартное отклонение)",
    note: "Проверка проекта на модели участка Актогая со всеми модулями: из 16 моментов через каждые 2 часа ветвь «ничего не менять» сравнивается с ветвью, отличающейся пренебрежимо малым изменением, на тех же случайных потоках. У одного самосвала на 300 л меньше топлива (он заправляется раньше): стандартное отклонение разницы итога 7,6 млн тг, крайние −10,1 и +13,7 млн тг, меди 0,68 т; 200 т руды на складе дроблёной руды сверх имеющихся: 4,7 млн тг; у одного самосвала 5 м лишнего пути: 0 (разница 45 тг). До перехода на потоки отдельных машин те же проверки давали 11,2 млн тг, 2,3 млн тг и 16,8 млн тг. Оставшийся разброс — не случайные числа: модуль диспетчеризации по-другому распределяет самосвалы после малого сдвига во времени, и за 12 часов к дробилке приходят другие один-два самосвала руды или руда другого забоя; без модулей тот же сдвиг даёт 0,9 млн тг. Принято 8 млн тг: ниже этой стандартной ошибки на один повтор советник оценку разброса не опускает (`advisor.min_t`). Тексты прогноза и эффекта модуля называют разницу «в пределах разброса прогноза», если она не больше двух стандартных ошибок: 2 × 8 = 16 млн тг для одного прогноза, 2 × 8 / √n для среднего n прогнозов или повторов."}
  noise_cu_t: {<<: *assumed, value: 0.7, unit: t, status: assumption, title: "Парный разброс одного прогноза по меди за 12 ч (стандартное отклонение)",
    note: "Та же проверка: стандартное отклонение разницы меди 0,68 т при 300 л топлива у одного самосвала и 0,44 т при 200 т руды на складе (до перехода на потоки отдельных машин — 0,74 и 0,14 т)."}
  module_slots_first: {<<: *assumed, value: 6, unit: "-", status: assumption, title: "Первый слот прогнозов «с модулем / без модуля»",
    note: "Слоты 1 (страница) и 2–5 (советник) заняты; модули диспетчеризации, качества руды, фабрики и техобслуживания получают слоты 6–9 (`world.yaml`, `forecasts.module_slots`)."}
  module_period_h: {<<: *assumed, value: 3, unit: h, status: assumption, title: "Как часто модуль заказывает прогноз «с модулем / без модуля»",
    note: "Каждые 3 часа модели (9 минут стенда при ×20); модули сдвинуты друг относительно друга на 30 минут, чтобы ветви не считались одновременно."}
  module_first_min: {<<: *assumed, value: 10, unit: min, status: assumption, title: "Первый прогноз «с модулем / без модуля» после включения модуля",
    note: "Через 10 минут модели после включения или запуска сервиса."}
  module_results_kept: {<<: *assumed, value: 4, unit: "-", status: assumption, title: "Сколько последних прогнозов «с модулем / без модуля» усредняется",
    note: "Среднее четырёх прогнозов за последние 12 часов модели гасит часть разброса одного прогноза."}

advisor:
  truck_cluster_out: {<<: *assumed, value: 9, unit: "-", status: assumption, title: "Самосвалов вне работы, при котором отказы считаются групповыми",
    note: "При готовности парка около 87 % в ремонте и на обслуживании в среднем 4–5 самосвалов из 32; девять и больше (четверть парка) — заметная потеря провозной способности."}
  truck_cluster_min: {<<: *assumed, value: 10, unit: min, status: assumption, title: "Сколько минут модели должно держаться групповое выбытие самосвалов",
    note: "Отсекает случайные совпадения коротких остановок."}
  hard_ore_bwi: {<<: *assumed, value: 16.0, unit: kWh/t, status: assumption, title: "Индекс Бонда питания мельницы, с которого руда считается крепкой",
    note: "Среднее по месторождению 14,0 при разбросе блоков 1,2; на складе смесь многих блоков, поэтому 16 — за пределами обычных колебаний питания."}
  pad_reserve_t: {<<: *assumed, value: 5000, unit: t, status: assumption, title: "Запас на складе, с которого советник предлагает подавать руду в дробилку",
    note: "Не меньше пяти часов работы погрузчика при подаче 1000 т/ч."}
  hold_h: {<<: *assumed, value: 12, unit: h, status: assumption, title: "Срок указания оператора по варианту советника",
    note: "Равен горизонту прогноза: вариант оценён на этот срок. Модуль, владеющий тем же рычагом, это указание не перебивает; по окончании срока рычаг возвращается модулю или базовому правилу."}
  replicas: {<<: *assumed, value: 3, unit: "-", status: assumption, title: "Сколько парных повторов прогноза советник заказывает на каждый вариант",
    note: "Каждый повтор считает ветви «ничего не менять» и «вариант» на одних и тех же случайных потоках (отказы, погрузка, рейсы), разных для разных повторов; выигрыш варианта — среднее по повторам, его стандартная ошибка — по их разбросу. Три повтора — наименьшее число, по которому разброс вообще оценивается, и 4 ветви × 3 = 12 процессов; на стенде разбор инцидента готов через 15–30 с (`forecast.max_parallel`)."}
  min_t: {<<: *assumed, value: 2.0, unit: "-", status: assumption, title: "Во сколько стандартных ошибок должен уложиться выигрыш рекомендуемого варианта",
    note: "Советник рекомендует вариант, только если его средний выигрыш не меньше двух стандартных ошибок: при нормальном разбросе вариант, который на деле не лучше, проходит этот порог примерно в 2–3 случаях из 100. Стандартная ошибка — по трём повторам, но не меньше `forecast.noise_kzt` / √3 = 4,6 млн тг: три близких повтора не делают прогноз точнее, чем показала проверка. Порог при трёх повторах — не меньше 9,2 млн тг (около 1,5 т меди за 12 ч). Достоверность в тексте: «высокая» — от 4 стандартных ошибок, «средняя» — от 2, «низкая» — от 1, ниже — «нет»."}
  min_gain_kzt: {<<: *assumed, value: 3000000, unit: KZT, status: assumption, title: "Наименьший выигрыш варианта, при котором советник его рекомендует",
    note: "Сколько должен дать вариант, чтобы ради него стоило давать указание: 3 млн тг — около 0,5 т меди за 12 часов, 0,3 % переменной маржи смены. Обычно порог разброса (`advisor.min_t`) выше и решает он."}
  max_cu_loss_t: {<<: *assumed, value: 1.0, unit: t, status: assumption, title: "Наибольшая потеря меди за горизонт, с которой вариант ещё может быть рекомендован",
    note: "Жёсткое ограничение: мельница — узкое место фабрики, и медь, не полученная сейчас, позже не наверстывается. Вариант, теряющий в среднем по повторам больше 1 т меди, показывается, но не рекомендуется, сколько бы он ни давал по деньгам. 1 т — около полутора стандартных отклонений меди одного прогноза (`forecast.noise_cu_t`): меньшая потеря неотличима от разброса."}
  min_cu_t: {<<: *assumed, value: 0.5, unit: t, status: assumption, title: "Наименьшая разница меди, ниже которой выигрыш «только на запасах» не рекомендуется",
    note: "Выигрыш варианта делится на деньги горизонта — медь по средней руде месторождения (выручка минус медь сверх средней руды, отданная запасами) и затраты на дизель, энергию и перевалку — и на работу парка, вложенную в руду и вскрышу, которые горизонт оставляет. Вариант, у которого деньги горизонта меньше `advisor.min_gain_kzt`, а медь отличается меньше чем на 0,5 т или деньги горизонта дают меньше половины выигрыша, не рекомендуется: такой выигрыш держится на запасах, а не на меди."}
  reanalyse_stock_h: {<<: *assumed, value: 2.0, unit: h, status: assumption, title: "На сколько часов питания мельницы должен упасть склад, чтобы советник разобрал тот же инцидент заново",
    note: "Варианты оценены на момент начала инцидента. Если инцидент длится (дробилка стоит часами, экскаватор в ремонте), а склад дроблёной руды за это время потерял два часа питания мельницы и больше, те же рычаги стоят уже другого: советник строит и прогнозирует варианты снова. Если вариант уже применён, повторного разбора нет."}
  retry_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Через сколько минут модели советник повторяет запрос прогнозов, если ответа нет",
    note: "Обычно прогнозы готовы через несколько секунд стенда, то есть через несколько минут модели."}

response:
  wage_kzt_month: {value: 888903, unit: KZT/month, status: sourced, title: "Среднемесячная номинальная зарплата в горнодобывающей промышленности",
    source: "Бюро национальной статистики АСПиР РК, «Численность и заработная плата работников в Республике Казахстан (II квартал 2025 г.)», строка «Горнодобывающая промышленность и разработка карьеров»",
    url: "https://stat.gov.kz/ru/industries/labor-and-income/stat-wags/publications/431530/",
    note: "Ставка ремонтника рудника берётся по средней по отрасли: зарплата слесарей и электриков Актогая не публикуется."}
  hours_month: {<<: *derived, value: 173.3, unit: h, status: derived, title: "Рабочих часов в месяце",
    note: "Нормальная продолжительность рабочего времени по Трудовому кодексу РК — 40 часов в неделю: 40 × 52 / 12 = 173,3 ч."}
  overtime_factor: {value: 1.5, unit: "-", status: snippet, title: "Надбавка за сверхурочную работу",
    source: "Трудовой кодекс Республики Казахстан, статья 108 «Оплата труда за работу в сверхурочное время»",
    url: "https://kodeksy-kz.com/ka/trudovoj_kodeks/108.htm",
    note: "При повременной оплате — не ниже полуторного размера часовой ставки. Вторая бригада своих ремонтников выходит сверх смены, поэтому её час стоит по сверхурочной ставке."}
  payroll_factor: {<<: *assumed, value: 1.2, unit: "-", status: assumption, title: "Начисления работодателя на фонд оплаты труда",
    note: "Социальный налог, социальные отчисления и отчисления на обязательное медицинское страхование вместе — около пятой части зарплаты; точная сумма зависит от года и ставок, поэтому 1,2 — округлённое допущение."}
  crew_size: {<<: *assumed, value: 6, unit: "-", status: assumption, title: "Численность ремонтной бригады",
    note: "Слесари, электрик, сварщик, крановщик и мастер: состав бригады на ремонт узла дробилки или экскаватора. Источник не найден."}
  own_crew_kzt_h: {<<: *derived, value: 55400, unit: KZT/h, status: derived, title: "Час второй бригады своих ремонтников",
    note: "888 903 / 173,3 × 1,5 × 1,2 × 6 = 55 400 тг/ч: шесть человек по сверхурочной ставке с начислениями."}
  contractor_usd_h: {<<: *assumed, value: 150, unit: USD/h, status: assumption, title: "Час специалиста сервисной службы изготовителя или подрядчика",
    note: "В объявлениях дилеров Caterpillar в США механик выездной службы получает 27–59 USD/ч (Foley Equipment, 2025–2026 годы); заказчику час специалиста выставляют обычно в 2,5–3 раза дороже зарплаты (накладные, выезд, инструмент). 150 USD/ч — допущение по этой оценке."}
  contractor_people: {<<: *assumed, value: 2, unit: "-", status: assumption, title: "Специалистов подрядчика во второй бригаде",
    note: "Сервисный инженер изготовителя и гидравлик: то, чего не хватает своим ремонтникам для работы на втором фронте. Источник не найден."}
  contractor_min_h: {<<: *assumed, value: 8, unit: h, status: assumption, title: "Наименьшее оплачиваемое время вызова подрядчика",
    note: "Вызов на аварийный ремонт оплачивается не меньше смены специалиста, даже если работа кончилась раньше; это плата за выезд. Источник не найден."}
  second_crew_factor: {<<: *assumed, value: 0.6, unit: "-", status: assumption, title: "Во сколько раз вторая бригада сокращает оставшийся ремонт",
    note: "Вторая бригада открывает второй фронт работ (механика и гидравлика или электрика одновременно), но не делит время пополам: доступ к узлу один, кран один, часть работы идёт по очереди (разборка, замена, проверка). Оставшееся время ремонта умножается на 0,6. Источник не найден."}
  workshop_lend_factor: {<<: *assumed, value: 0.75, unit: "-", status: assumption, title: "Во сколько раз бригада мастерской сокращает ремонт экскаватора",
    note: "Бригада одного бокса мастерской уходит в забой помогать полевой бригаде: время ремонта × 0,75, меньше, чем вторая бригада с подрядчиком (свои слесари, без сервисного инженера). Бокс стоит, пока экскаватор в ремонте: плановое обслуживание самосвалов ждёт. Источник не найден."}
  grader_kzt_h: {<<: *assumed, value: 53800, unit: KZT/h, status: assumption, title: "Час работы автогрейдера рудника",
    note: "Стоимость владения и эксплуатации карьерного автогрейдера класса Cat 16M с машинистом и топливом — около 120 USD/ч × 448,45 = 53 800 тг/ч. Опубликованных ставок аренды грейдеров в Казахстане не найдено."}
  grading_h: {<<: *assumed, value: 1.5, unit: h, status: assumption, title: "Время подготовки мокрого съезда грейдером с подсыпкой",
    note: "Грейдер срезает размокший слой и разравнивает подсыпку на съезде длиной 2,6 км за несколько проходов. Источник не найден."}
  topping_m: {<<: *assumed, value: 0.05, unit: m, status: assumption, title: "Толщина подсыпки дроблёной породой на мокрый съезд",
    note: "Слой 5 см по всей ширине проезжей части. Порода — своя, со склада дроблёной вскрыши: её цена — работа парка на тонну (`economics.stock_kzt_t`), насыпная плотность — `rock.loose_density_t_m3`."}
  treated_wet_kmh: {<<: *assumed, value: 15, unit: km/h, status: assumption, title: "Ограничение скорости на подготовленном мокром съезде",
    note: "Съезд, закрытый в сильный дождь, после грейдера и подсыпки открывают с ограничением 15 км/ч, пока идут осадки и дорога не просохла. Правило рудника, источник не найден."}
  road_crew_kzt_h: {<<: *assumed, value: 358800, unit: KZT/h, status: assumption, title: "Час аварийной дорожной бригады",
    note: "Бульдозер, фронтальный погрузчик, автогрейдер и два самосвала с подсыпкой, снятые с других работ: около 800 USD/ч × 448,45 = 358 800 тг/ч стоимости владения и эксплуатации. Источник не найден."}
  road_repair_h: {<<: *assumed, value: 2, unit: h, status: assumption, title: "Время аварийного ремонта участка дороги",
    note: "Аварийная бригада расчищает одну полосу и временно подсыпает её: участок открывают через 2 ч с ограничением скорости, а полный ремонт идёт дальше до ожидаемого окончания. Источник не найден."}
  repaired_kmh: {<<: *assumed, value: 15, unit: km/h, status: assumption, title: "Ограничение скорости на участке после аварийного ремонта",
    note: "Временная подсыпка и одна расчищенная полоса: 15 км/ч до конца полного ремонта. Правило рудника, источник не найден."}
  workshop_overtime_h: {<<: *assumed, value: 12, unit: h, status: assumption, title: "Срок сверхурочной работы мастерской",
    note: "Вторая бригада мастерской выходит на смену: 12 ч, пока в боксах есть ремонт отказавших самосвалов; время каждого такого ремонта × `response.second_crew_factor`."}

