# Heading and opening sentence of each group in docs/mine/parameters.md.

_groups:
  rock: {title: "Горная порода"}
  pit: {title: "Карьер",
    intro: "Геометрию карьера Актогай KAZ Minerals не публикует: ни глубины, ни углов бортов, ни трасс съездов. Модель строит карьер по этим параметрам (`mine/model/layout.py`): уступы по 15 м с откосом и бермой, рабочие площадки разносок, съезды с постоянным уклоном вдоль бортов. Глубина рабочего дна 255 м — допущение; конечная глубина 340 м и длина 2,5 км известны только из студенческой дипломной работы."}
  geology: {title: "Геология и блочная модель",
    intro: "Содержание меди и крепость блоков задаются гладкими случайными полями (`mine/model/geology.py`). Доли классов по тоннажу взяты из отчётов KAZ Minerals: вскрыша — по коэффициенту вскрыши 2024 года, бедная руда — по избытку добытой сульфидной руды над переработанной в 2025 году (она идёт на склад бедной руды), среднее содержание руды — содержание в питании фабрик за 2025 год."}
  truck: {title: "Самосвал Caterpillar 785C",
    intro: "Модель самосвала — из проектного парка Актогая и Бозшаколя (обзор проектов KAZ Minerals 2014 года: 18 самосвалов Caterpillar 785C грузоподъёмностью до 140 т). Скорость и расход топлива не задаются, а получаются из массы, мощности, уклона и сопротивления качению (`mine/common/physics.py`)."}
  loader: {title: "Экскаватор Hitachi EX3600E-6",
    intro: "В проекте 2014 года — четыре электрических экскаватора Hitachi с ковшом 21 м3; EX3600E-6 — электрическое исполнение прямой лопаты Hitachi с ковшом 21 м3. Экскаваторы питаются от подстанции рудника."}
  drill: {title: "Бурение (Sandvik D55SP)", intro: "В проекте 2014 года — четыре станка вращательного бурения Sandvik D55. Сетка скважин и высота уступа согласованы между собой по правилам справочника Dyno Nobel."}
  blast: {title: "Взрывные работы"}
  road: {title: "Дороги"}
  plan: {title: "Расчёт парка по фабрике",
    intro: "Парк рассчитан по фабрике: линия №1 должна получать руду со скоростью, с которой её перерабатывает мельница, а вместе с рудой надо вынимать бедную руду и вскрышу в доле, которую дают отчёты KAZ Minerals. Время рейса берётся из самой модели на исходных забоях (`mine/sim/design_basis.py`); тест проверяет, что числа этой группы и расстановка самосвалов в `world.yaml` совпадают с расчётом."}
  crusher: {title: "Первичная дробилка"}
  dump: {title: "Отвал и рудные склады"}
  conveyor: {title: "Конвейер"}
  stockpile: {title: "Склад дроблёной руды"}
  rom: {title: "Рудные склады и подача с них"}
  mill: {title: "Мельницы",
    intro: "Измельчение линии №1 по обзору проектов KAZ Minerals 2014 года: одна мельница полусамоизмельчения 40 × 26 футов (28 МВт) и две шаровые мельницы 28 × 44 фута (по 22 МВт), все с безредукторным приводом. Питатель подаёт руду со склада по уставке; пропускная способность цикла ограничена установленной мощностью 72 МВт, мощность делится между МПСИ и шаровыми мельницами в отношении их установленных мощностей."}
  flotation: {title: "Флотация"}
  concentrate: {title: "Концентрат и хвосты", intro: "Концентрат после сгущения и фильтрации копится на складе и отгружается партиями; хвосты флотации идут в хвостохранилище. Масса концентрата = медь в концентрате / содержание меди в нём; хвосты = переработанная руда − концентрат."}
  plant: {title: "Прочие потребители фабрики"}
  fuel_station: {title: "Заправочная станция"}
  workshop: {title: "Мастерская"}
  reliability: {title: "Надёжность и обслуживание",
    intro: "Дефект появляется случайно, развивается и заканчивается отказом; пока он развивается, его видно по показателям состояния машины (`mine/sim/reliability.py`)."}
  weather: {title: "Погода",
    intro: "Погода следует климатическим нормам станции Актогай (ВМО 1991–2020) на дату модели: средние температуры месяцев отнесены к их серединам и интерполируются по дням, суточный ход — между средними максимумом и минимумом. Осадки выпадают случайно: вероятность дня с осадками и их количество — по нормам месяца (`mine/sim/weather.py`)."}
  sim: {title: "Настройки модели"}
  dispatch: {title: "Модуль диспетчеризации",
    intro: "Настройки сервиса `mine-dispatch` (`mine/modules/dispatch`): время пути, очереди и погрузки модуль считает сам по состоянию двойников, эти числа задают только пределы его решений."}
  grade_control: {title: "Модуль управления качеством руды", intro: "Настройки сервиса `mine-grade` (`mine/modules/grade`)."}
  plant_control: {title: "Модуль управления фабрикой", intro: "Настройки сервиса `mine-plant` (`mine/modules/plant`)."}
  maintenance: {title: "Модуль техобслуживания",
    intro: "Настройки сервиса `mine-maint` (`mine/modules/maint`): пороги, по которым модуль отличает развивающийся дефект от обычного износа."}
  scenario: {title: "Сценарии «что если»"}
  economics: {title: "Деньги и выбросы CO₂",
    intro: "Переменная маржа рудника: выручка за оплачиваемую медь в концентрате минус дизельное топливо самосвалов и электроэнергия рудника и фабрики. Труд, ремонт, взрывчатка, реагенты, амортизация и прочие постоянные затраты не учитываются. Цены и курс на октябрь 2026 года."}
  forecast: {title: "Прогноз «два будущих»", intro: "Настройки прогноза: симулятор копирует свою модель и прогоняет копию вперёд вместе с ядрами модулей (`mine/sim/forecast.py`). Маржа ветви — та же переменная маржа, что у рудника: выручка за медь минус дизель и электроэнергия за горизонт. Отдельно считается поправка на то, что горизонт оставляет следующей смене: вся руда между забоем и флотацией — взорванная в карьере, в кузовах, в бункере дробилки, на конвейере, на складе дроблёной руды, на рудных складах, в мельнице — оценивается одинаково (группа «Деньги и выбросы CO₂», `economics.stock_kzt_t`). Советник и страница сравнивают варианты по сумме маржи и поправки — итогу с поправкой."}
  response: {title: "Ресурсы смены на инциденты",
    intro: "Рычаги начальника смены при инциденте, кроме тех, что уже ведут модули: вторая ремонтная бригада со специалистами подрядчика, бригада мастерской в забое, грейдер с подсыпкой на мокрый съезд, аварийная дорожная бригада, сверхурочная смена мастерской. Каждый рычаг — живое сообщение двойнику, на который он действует (`mine/sim/response.py`); его цена входит в итог прогноза отдельной частью «ресурсы смены»."}
  advisor: {title: "Модуль-советник", intro: "Настройки сервиса `mine-advisor` (`mine/modules/advisor`): с каких значений состояние рудника считается инцидентом и на какой срок даются указания по его вариантам."}
  reference: {title: "Показатели рудника без модулей (для справки)",
    intro: "Измерены тестом `mine/tests/test_modules.py`: 7 суток модели без модулей, зерно из `sim.seed`; тест проверяет, что числа совпадают с прогоном. На стенде модули с этими числами не сравниваются: эффект модуля измеряется прогнозом «с модулем / без модуля» от одного и того же состояния рудника (группа «Прогноз»)."}

rock:
  insitu_density_t_m3: {<<: *dyno, value: 2.56, unit: t/m3, status: sourced, title: "Плотность породы в массиве",
    note: "С. 10, таблица свойств пород, строка «порфир». Плотность руды Актогая не опубликована."}
  loose_density_t_m3: {<<: *hitachi, value: 1.8, unit: t/m3, status: sourced, title: "Насыпная плотность взорванной породы",
    note: "С. 17: ковш 21 м3 рассчитан на материал плотностью не более 1800 кг/м3. Коэффициент разрыхления 2,56 / 1,8 = 1,42."}

pit:
  face_angle_deg: {<<: *assumed, value: 65, unit: deg, status: assumption, title: "Угол откоса уступа",
    note: "Углы бортов карьера Актогай не опубликованы. 65° — обычный угол откоса уступа высотой 15 м в крепких скальных породах."}
  berm_m: {<<: *assumed, value: 10, unit: m, status: assumption, title: "Ширина бермы на конечном борту",
    note: "Ширина бермы не опубликована. С откосом 65° (заложение 15 / tg 65° = 7,0 м) уступ занимает 17,0 м по горизонтали: угол конечного борта atan(15 / 17,0) = 41°, внутри обычных для порфировых карьеров 35–45°."}
  depth_m: {<<: *assumed, value: 255, unit: m, status: assumption, title: "Глубина рабочего дна участка от бровки",
    note: "Текущая глубина карьера не опубликована. Конечная глубина 340 м известна только из студенческой работы (`world.yaml`: бровка +375 м, дно +120 м, 17 уступов); после девяти лет отработки сульфидной зоны принято около 3/4 конечной глубины."}
  final_depth_m: {<<: *thesis, value: 340, unit: m, status: sourced, title: "Конечная глубина карьера (для сравнения)",
    note: "Аннотация: карьер на конец отработки длиной 2545 м, шириной 370 м, глубиной 340 м. Студенческая работа, не данные KAZ Minerals; ширина 370 м с такой глубиной несовместима с углами бортов, поэтому модель берёт только порядок глубины и длины."}
  final_length_m: {<<: *thesis, value: 2545, unit: m, status: sourced, title: "Конечная длина карьера (для сравнения)",
    note: "Там же. Бровка модели — эллипс 2300 × 1400 м (`world.yaml`)."}
  rim_elevation_m: {value: 374, unit: m, status: snippet, title: "Отметка поверхности у рудника",
    source: "Open-Meteo, Elevation API (цифровая модель рельефа) в точке 46,95° с. ш., 79,87° в. д.",
    url: "https://api.open-meteo.com/v1/elevation?latitude=46.95&longitude=79.8667",
    note: "Значение цифровой модели рельефа, не съёмки; бровка карьера в модели +375 м."}

geology:
  mean_head_grade_pct: {<<: *kz25, value: 0.41, unit: "% Cu", status: sourced, title: "Среднее содержание меди в руде, идущей на фабрику",
    note: "Среднее содержание в сульфидной руде, переработанной Актогаем за 2025 год (обе линии). Для сравнения: 0,43 % в 2024 году, 0,50 % в 2023 году (KAZ, с. 3)."}
  cutoff_grade_pct: {<<: *assumed, value: 0.20, unit: "% Cu", status: assumption, title: "Бортовое содержание",
    note: "Не опубликовано. Около половины содержания в питании: блоки ниже борта идут в отвал."}
  low_grade_below_pct: {<<: *assumed, value: 0.28, unit: "% Cu", status: assumption, title: "Верхняя граница бедной руды",
    note: "Не опубликована. Руда от бортового содержания до этой границы идёт на склад бедной сульфидной руды (на плане рудника 2014 года: «low-grade sulphide ore stockpile»); граница выбрана так, чтобы руда выше неё в среднем содержала 0,41 % при разбросе ниже."}
  strip_ratio: {<<: *kzwaste, value: 0.363, unit: t/t, status: derived, title: "Коэффициент вскрыши",
    note: "Вскрыша Актогая 26,7 млн т (2024 год, KZ-WASTE) / добытая сульфидная руда 73,486 млн т (2024 год, отчёт KAZ за 2024 год, с. 3) = 0,363 т/т. Отношение ко всей добытой руде, с окисленной, — 0,31. Доля вскрыши в горной массе 0,363 / 1,363 = 26,6 %."}
  low_grade_share: {<<: *kz25, value: 0.216, unit: t/t, status: derived, title: "Бедная руда на тонну руды, идущей на фабрику",
    note: "Добыто сульфидной руды 75,512 млн т, переработано 62,095 млн т (2025 год): 75,512 / 62,095 − 1 = 0,216. Избыток идёт на склад бедной руды; доля бедной руды в горной массе 0,734 × 0,216 / 1,216 = 13,0 %, руды для фабрики — 60,4 %."}
  ore_grade_log_sigma: {<<: *assumed, value: 0.6, unit: "-", status: assumption, title: "Разброс содержания в руде (сигма логнормального распределения)",
    note: "Превышение содержания над границей бедной руды распределено логнормально; при сигме 0,6 рудные блоки лежат примерно от 0,31 до 0,65 % Cu."}
  waste_grade_min_share: {<<: *assumed, value: 0.15, unit: "-", status: assumption, title: "Содержание в самой бедной вскрыше, доля бортового",
    note: "Вскрышные блоки получают содержание от этой доли бортового до верхней доли."}
  waste_grade_max_share: {<<: *assumed, value: 0.95, unit: "-", status: assumption, title: "Содержание в самой богатой вскрыше, доля бортового",
    note: "Чуть ниже борта, чтобы класс блока не зависел от округления."}
  correlation_length_m: {<<: *assumed, value: 250, unit: m, status: assumption, title: "Радиус корреляции содержания и крепости",
    note: "Соседние блоки (115 × 50 м) получают близкие значения; через несколько сотен метров связь пропадает."}
  wavelength_min_factor: {<<: *assumed, value: 2, unit: "-", status: assumption, title: "Самая короткая волна поля, в радиусах корреляции",
    note: "Поле складывается из плоских волн случайного направления с длиной от 2 до 6 радиусов корреляции (500–1500 м)."}
  wavelength_max_factor: {<<: *assumed, value: 6, unit: "-", status: assumption, title: "Самая длинная волна поля, в радиусах корреляции",
    note: "См. предыдущую строку."}
  bwi_mean_kwh_t: {<<: *assumed, value: 14.0, unit: kWh/t, status: assumption, title: "Средний индекс работы Бонда",
    note: "Для Актогая не опубликован. Порфировые руды в обзоре: 5,7–20,2 кВт·ч/т (Сарчешме), около 13 (два месторождения SAGDesign); взята середина."}
  bwi_sd_kwh_t: {<<: *assumed, value: 1.2, unit: kWh/t, status: assumption, title: "Стандартное отклонение индекса Бонда между блоками",
    note: "Даёт блоки примерно от 11,5 до 16,5 кВт·ч/т, внутри диапазона порфировых руд."}
  bwi_min_kwh_t: {<<: *assumed, value: 10.5, unit: kWh/t, status: assumption, title: "Нижняя граница индекса Бонда", note: "Ограничение хвоста распределения."}
  bwi_max_kwh_t: {<<: *assumed, value: 18.0, unit: kWh/t, status: assumption, title: "Верхняя граница индекса Бонда", note: "Ограничение хвоста распределения."}

truck:
  payload_t: {<<: *cat785, value: 136, unit: t, status: sourced, title: "Номинальная грузоподъёмность",
    note: "Rated / nominal payload 300 000 фунтов (136,1 т). В обзоре KAZ 2014 года (с. 11) — до 140 т."}
  empty_mass_t: {<<: *cat785, value: 102.1, unit: t, status: sourced, title: "Масса без груза",
    note: "Empty weight с плоским кузовом 225 200 фунтов (102,1 т). Полная масса 102,1 + 136 = 238,1 т при наибольшей допустимой 249,5 т."}
  engine_kw: {<<: *cat785, value: 1005, unit: kW, status: sourced, title: "Мощность двигателя (нетто)",
    note: "Cat 3512B-EUI: 1348 л. с. (1005 кВт) нетто по SAE J1349 / ISO 9249, брутто 1081 кВт."}
  max_speed_kmh: {<<: *cat785, value: 54.7, unit: km/h, status: sourced, title: "Наибольшая скорость с грузом", note: "Шестая передача, 34 мили/ч."}
  bsfc_g_kwh: {<<: *assumed, value: 210, unit: g/kWh, status: assumption, title: "Удельный расход топлива двигателя",
    note: "Для Cat 3512B в найденных источниках не указан; обычный уровень для крупных быстроходных дизелей этого класса. Расход в час = использованная мощность × 210 г/кВт·ч ÷ плотность топлива; на полной мощности 1005 × 0,210 / 0,8318 = 253,7 л/ч."}
  diesel_density_kg_l: {<<: *turija, value: 0.8318, unit: kg/l, status: sourced, title: "Плотность дизельного топлива",
    note: "Раздел 2, значение, которым рудник Турия пересчитывает массу топлива в объём."}
  idle_load_factor: {<<: *assumed, value: 0.10, unit: "-", status: assumption, title: "Загрузка двигателя на холостом ходу",
    note: "Источник не найден. 10 % мощности на вспомогательные агрегаты: 253,7 × 0,10 = 25,4 л/ч при стоянке с работающим двигателем."}
  cycle_load_factor_min: {<<: *turija, value: 0.35, unit: "-", status: sourced, title: "Средняя загрузка двигателя за рейс, нижняя граница",
    note: "Раздел 2: 0,35 для средних условий. Соответствует 253,7 × 0,35 = 89 л/ч. Модель не задаёт этот коэффициент, а проверяется по нему."}
  cycle_load_factor_max: {<<: *turija, value: 0.50, unit: "-", status: sourced, title: "Средняя загрузка двигателя за рейс, верхняя граница",
    note: "Разделы 2–3: 0,50 для тяжёлых условий, 0,45–0,50 измерено на самосвалах рудника Турия. Соответствует 127 л/ч."}
  drivetrain_efficiency: {<<: *assumed, value: 0.80, unit: "-", status: assumption, title: "Доля мощности двигателя на колёсах",
    note: "Кривые тяги 785C не найдены. Потери механической трансмиссии с гидротрансформатором и привод вспомогательных агрегатов. На подъёме 10 % с грузом даёт 9,7 км/ч, на 8 % — 11,6 км/ч (вторая и третья передачи 785C — 16,4 и 22,2 км/ч наибольшей скорости)."}
  accel_max_ms2: {<<: *assumed, value: 0.5, unit: m/s2, status: assumption, title: "Наибольшее ускорение", note: "Ограничение по плавности разгона; на подъёме разгон ограничен мощностью."}
  brake_ms2: {<<: *assumed, value: 1.0, unit: m/s2, status: assumption, title: "Рабочее замедление", note: "Спокойное служебное торможение."}
  downhill_threshold_pct: {<<: *assumed, value: 4.0, unit: "%", status: assumption, title: "Уклон, с которого спуск идёт на замедлителе", note: "На более крутом спуске скорость ограничена замедлителем."}
  downhill_loaded_kmh: {<<: *assumed, value: 20, unit: km/h, status: assumption, title: "Скорость гружёного самосвала на спуске",
    note: "Кривые замедлителя не найдены. Спуск с грузом в модели редок (объезды при закрытых участках)."}
  downhill_empty_kmh: {<<: *assumed, value: 30, unit: km/h, status: assumption, title: "Скорость порожнего самосвала на спуске", note: "Равна ограничению скорости на съездах."}
  pace_min: {<<: *assumed, value: 0.92, unit: "-", status: assumption, title: "Разброс манеры вождения",
    note: "Каждый участок самосвал проходит со скоростью от 92 до 100 % допустимой."}
  overload_limit: {<<: *cat785, value: 1.08, unit: "-", status: derived, title: "Допустимая перегрузка",
    note: "Наибольшая полная масса 249,5 т − масса без груза 102,1 т = 147,4 т = 1,08 × 136 т. Погрузка прекращается, когда следующий ковш увёл бы груз дальше от номинала."}
  tank_l: {<<: *cat785, value: 1892, unit: l, status: sourced, title: "Объём топливного бака", note: "Fuel tank 500 галлонов (1892,5 л)."}
  refuel_below_pct: {<<: *assumed, value: 15, unit: "%", status: assumption, title: "Остаток топлива, при котором самосвал едет на заправку", note: "Около двух часов работы в запасе."}
  local_speed_kmh: {<<: *assumed, value: 15, unit: km/h, status: assumption, title: "Скорость по рабочей площадке, от узла дороги до экскаватора", note: "Движение по рабочей площадке уступа."}
  queue_spacing_m: {<<: *assumed, value: 25, unit: m, status: assumption, title: "Шаг машин в очереди", note: "Длина самосвала (11,1 м) с промежутком."}
  changeover_min: {<<: *assumed, value: 30, unit: min, status: assumption, title: "Длительность пересменки экипажа",
    note: "После первой разгрузки в новой смене самосвал стоит на передаче смены и ежесменном осмотре. Источник не найден; на карьерах с 12-часовыми сменами передача с осмотром обычно занимает 20–45 минут."}
  meal_break_min: {<<: *assumed, value: 40, unit: min, status: assumption, title: "Перерыв экипажа на приём пищи за смену",
    note: "Источник не найден. Вместе с пересменкой и заправкой самосвал в смену работает около 10,5 из 12 часов: так время работы исправного самосвала приближается к коэффициенту использования 0,80, по которому рассчитан парк (`plan.use_of_availability`)."}
  break_from_h: {<<: *assumed, value: 4, unit: h, status: assumption, title: "Начало окна перерывов экипажей от начала смены",
    note: "Перерывы разнесены по времени, чтобы экскаваторы не простаивали: у каждого самосвала свой момент между 4 и 8 часами смены."}
  break_to_h: {<<: *assumed, value: 8, unit: h, status: assumption, title: "Конец окна перерывов экипажей от начала смены", note: "См. предыдущую строку."}
  engine_temp_thermostat_c: {<<: *assumed, value: 85, unit: "°C", status: assumption, title: "Температура охлаждающей жидкости без нагрузки",
    note: "Пороговые значения двигателя не найдены; взят обычный уровень термостата дизеля."}
  engine_temp_full_load_c: {<<: *assumed, value: 96, unit: "°C", status: assumption, title: "Температура охлаждающей жидкости на полной мощности",
    note: "При опорной температуре воздуха; между холостым ходом и полной мощностью температура растёт вместе с загрузкой двигателя."}
  engine_temp_ambient_ref_c: {<<: *assumed, value: 20, unit: "°C", status: assumption, title: "Опорная температура воздуха для температуры двигателя", note: "Точка, к которой отнесены два значения выше."}
  engine_temp_ambient_gain: {<<: *assumed, value: 0.15, unit: "°C/°C", status: assumption, title: "Влияние температуры воздуха на температуру двигателя", note: "Система охлаждения гасит большую часть колебаний воздуха."}
  engine_temp_lag_min: {<<: *assumed, value: 5, unit: min, status: assumption, title: "Постоянная времени температуры двигателя", note: "Тепловая инерция системы охлаждения."}
  engine_cooldown_lag_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Постоянная времени остывания заглушенного двигателя", note: "В ремонте и на заправке двигатель остывает к температуре воздуха."}
  tyres: {<<: *cat785, value: 6, unit: "-", status: sourced, title: "Число шин", note: "Шины 33.00-R51: две передние и четыре задние (сдвоенные)."}
  tyre_tkph_ref_ambient_c: {<<: *michelin, value: 38, unit: "°C", status: sourced, title: "Температура воздуха, к которой отнесён показатель TKPH шины",
    note: "Определение TKPH и поправка K2 (с. 171): TKPH = средняя нагрузка на шину, т × средняя скорость, км/ч."}
  tyre_tkph_rating: {<<: *assumed, value: 750, unit: t·km/h, status: assumption, title: "Показатель TKPH шины",
    note: "Каталожное значение для шин 33.00-R51 модели не найдено. Рабочая точка модели: средняя нагрузка (238,1 + 102,1) / 2 / 6 = 28,4 т на шину × около 20 км/ч = 570; шина выбрана с запасом около 30 %."}
  tyre_temp_rise_at_rating_c: {<<: *assumed, value: 55, unit: "°C", status: assumption, title: "Нагрев шины над воздухом при работе на паспортном TKPH",
    note: "Предельная температура шины в справочнике не дана. Нагрев пропорционален произведению нагрузки на скорость, как в определении TKPH."}
  tyre_temp_limit_c: {<<: *derived, value: 93, unit: "°C", status: derived, title: "Расчётный предел температуры шины",
    note: "38 + 55 = 93 °C: температура, до которой шина нагревается на паспортном TKPH при опорной температуре воздуха."}
  tyre_temp_lag_min: {<<: *assumed, value: 60, unit: min, status: assumption, title: "Постоянная времени температуры шины", note: "Крупногабаритная шина прогревается и остывает около часа."}

loader:
  bucket_m3: {<<: *hitachi, value: 21, unit: m3, status: sourced, title: "Вместимость ковша",
    note: "С. 17: прямая лопата с ковшом 21 м3 (SAE, с шапкой 2:1); в обзоре KAZ 2014 года (с. 10) — экскаваторы Hitachi 21 м3."}
  fill_factor: {<<: *derived, value: 0.90, unit: "-", status: derived, title: "Коэффициент наполнения ковша",
    note: "136 т за 4 ковша = 34 т на ковш; 34 / (21 м3 × 1,8 т/м3) = 0,90: верхняя граница полосы «средние условия» 75–90 % статьи Caterpillar о наполнении ковша, ковш рассчитан на плотность до 1,8 т/м3."}
  fill_factor_sd: {<<: *assumed, value: 0.04, unit: "-", status: assumption, title: "Разброс наполнения от ковша к ковшу", note: "Даёт груз самосвала около 136 ± 6 т."}
  fill_factor_min: {<<: *assumed, value: 0.65, unit: "-", status: assumption, title: "Наименьшее наполнение ковша", note: "Нижняя граница для крупнокусковой взорванной массы."}
  fill_factor_max: {<<: *assumed, value: 1.0, unit: "-", status: assumption, title: "Наибольшее наполнение ковша", note: "Ковш с шапкой на хорошо взорванной породе."}
  fill_frag_slope: {<<: *assumed, value: 0.25, unit: "-", status: assumption, title: "Падение наполнения ковша с ростом крупности",
    note: "Наполнение = 0,90 × (1 − 0,25 × (P80 − P80оп) / P80оп). Направление связи описано в ISEE 2005 «Characteristics of the blasted muck and the loader's productivity»; численного значения в источниках нет."}
  pass_s: {<<: *assumed, value: 30, unit: s, status: assumption, title: "Длительность одного цикла черпания",
    note: "Не опубликована. По паспорту поворот 3,2 об/мин: поворот на 90° к самосвалу и обратно около 9 с, черпание и разгрузка ковша около 20 с; 4 ковша = 2 минуты на самосвал."}
  pass_spread: {<<: *assumed, value: 0.15, unit: "-", status: assumption, title: "Разброс длительности цикла черпания", note: "Равномерно ± 15 %."}
  spot_s: {<<: *assumed, value: 45, unit: s, status: assumption, title: "Время установки самосвала под погрузку", note: "Источник не найден."}
  power_rated_kw: {<<: *hitachi, value: 1200, unit: kW, status: sourced, title: "Мощность электропривода экскаватора",
    note: "С. 14: EX3600E-6, асинхронный двигатель 6 кВ, номинальная длительная мощность 1200 кВт."}
  load_factor_digging: {<<: *assumed, value: 0.75, unit: "-", status: assumption, title: "Загрузка привода при черпании", note: "Источник не найден."}
  load_factor_idle: {<<: *assumed, value: 0.08, unit: "-", status: assumption, title: "Загрузка привода в ожидании", note: "Насосы и вспомогательные системы."}
  load_factor_travel: {<<: *assumed, value: 0.40, unit: "-", status: assumption, title: "Загрузка привода при переезде", note: "Источник не найден."}
  travel_kmh: {<<: *hitachi, value: 2.2, unit: km/h, status: sourced, title: "Скорость передвижения экскаватора", note: "С. 17: наибольшая скорость хода 2,2 км/ч."}
  relocate_setup_min: {<<: *assumed, value: 15, unit: min, status: assumption, title: "Подготовка забоя после переезда", note: "Перенос кабеля и планировка площадки."}
  face_offset_m: {<<: *assumed, value: 15, unit: m, status: assumption, title: "Расстояние от экскаватора до кромки блока", note: "Экскаватор стоит на рабочей площадке перед блоком; около радиуса черпания."}
  fallback_wait_min: {<<: *assumed, value: 10, unit: min, status: assumption, title: "Простой экскаватора, после которого его самосвалы уходят к другому",
    note: "Правило мастера смены: если экскаватор неисправен, выведен из зоны взрыва или переезжает дольше этого времени, его самосвалы временно грузятся у других."}
  ore_faces: {<<: *derived, value: 4, unit: "-", status: derived, title: "Экскаваторов на руде по плану",
    note: "5 экскаваторов × доля руды (с бедной) в горной массе 0,734 = 3,7 ≈ 4; пятый работает на вскрыше."}

drill:
  bench_height_m: {<<: *dyno, value: 15, unit: m, status: derived, title: "Высота уступа",
    note: "С. 4: высота уступа, м ≥ диаметр скважины, мм / 15. Для скважин 216 мм: 216 / 15 = 14,4 м ≤ 15 м."}
  hole_diameter_mm: {<<: *assumed, value: 216, unit: mm, status: assumption, title: "Диаметр взрывных скважин",
    note: "Долото 8½ дюйма, внутри диапазона станка Sandvik D55SP (172–254 мм, бурение за один проход до 17 м — больше глубины скважины 16,7 м): наибольший распространённый диаметр, совместимый с уступом 15 м по правилу Dyno Nobel."}
  burden_m: {<<: *dyno, value: 6.0, unit: m, status: derived, title: "Линия наименьшего сопротивления",
    note: "С. 4: (25–40) × диаметр = 5,4–8,6 м; взято 6,0 м (27,8 диаметра). Отношение высоты уступа к ЛНС 15 / 6 = 2,5, в полосе хорошего дробления 2–3,5."}
  spacing_m: {<<: *dyno, value: 7.0, unit: m, status: derived, title: "Расстояние между скважинами в ряду", note: "С. 4: 1,15 × ЛНС = 6,9 м, округлено до 7,0 м."}
  subdrill_m: {<<: *dyno, value: 1.7, unit: m, status: derived, title: "Перебур", note: "С. 4: (3–15) × диаметр; взято 8 × 0,216 = 1,7 м."}
  hole_depth_m: {<<: *derived, value: 16.7, unit: m, status: derived, title: "Глубина скважины", note: "Высота уступа 15 м + перебур 1,7 м."}
  gross_rate_m_h: {<<: *pitviper, value: 30.4, unit: m/h, status: snippet, title: "Сменная производительность бурового станка",
    note: "Для D55SP не найдена. Станок того же класса (Atlas Copco Pit Viper) — 365 м за 12-часовую смену на медном карьере, уступы 15 м: 365 / 12 = 30,4 м/ч, включая переезды между скважинами."}
  move_min_per_hole: {<<: *assumed, value: 8, unit: min, status: assumption, title: "Переезд и установка на скважину", note: "Источник не найден."}
  penetration_m_h: {<<: *derived, value: 40, unit: m/h, status: derived, title: "Чистая скорость бурения при средней крепости",
    note: "Скважина 16,7 м: 16,7 / 40 × 60 = 25 мин бурения + 8 мин переезда = 33 мин; 16,7 / 33 × 60 = 30,4 м/ч, что совпадает со сменной производительностью. В более крепкой породе скорость ниже обратно пропорционально индексу Бонда."}
  tram_kmh: {<<: *assumed, value: 1.5, unit: km/h, status: assumption, title: "Скорость перегона станка между блоками", note: "Источник не найден."}
  drill_ahead_blocks: {<<: *assumed, value: 17, unit: "-", status: assumption, title: "Запас подготовленных блоков, при котором бурение приостанавливается",
    note: "Станок не начинает новый блок, пока перед экскаваторами столько блоков взорвано, заряжено, обурено или бурится. На старте модели их 16 (6 взорванных, 3 заряженных, 4 обуренных и 3 в бурении, `world.yaml`), так что станки бурят с первого часа и дальше начинают новый блок, как только экскаватор переходит на очередной взорванный блок: бурение идёт в темпе выемки. Взорванной горной массы перед экскаваторами при этом около 2,0–2,2 млн т, 11–12 суток выемки. Три станка без остановок дают 15,3 км бурения в неделю, выемка стенда требует 13–14 км (около 1,3 млн т горной массы в неделю: скважина 16,7 м на 6 × 7 × 15 м × 2,56 т/м3 = 1613 т); тест `test_modules` проверяет, что за неделю пробурено не меньше, чем нужно на вынутую горную массу, а станки стоят меньше 30 % времени."}

blast:
